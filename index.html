<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Custo Certo</title>
<meta name="description" content="Custo, estoque e orçamento para oficinas e pequenas fábricas.">
<meta name="theme-color" content="#16A34A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="custocerto-icon-192.png">
<link rel="apple-touch-icon" href="custocerto-icon-192.png">
<style>
:root{
  --bg:#f3f5f8;--card:#ffffff;--ink:#16202b;--quiet:#5b6878;--line:#dde3ea;
  --menu:#1d2b3a;--menu-ink:#c9d4e0;--menu-on:#ffffff;
  --accent:#1f6feb;--accent-ink:#ffffff;--ok:#1a7f37;--warn:#b26a00;--bad:#c62828;
  --soft:#eef3fb;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11161c;--card:#1a2129;--ink:#e6edf3;--quiet:#9aa7b4;--line:#2c3642;
    --menu:#0b1015;--menu-ink:#9aa7b4;--menu-on:#ffffff;--soft:#1c2a3b;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11161c;--card:#1a2129;--ink:#e6edf3;--quiet:#9aa7b4;--line:#2c3642;
  --menu:#0b1015;--menu-ink:#9aa7b4;--menu-on:#ffffff;--soft:#1c2a3b;color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
aside{width:220px;background:var(--menu);padding:16px 10px;flex-shrink:0}
aside .marca{color:var(--menu-on);font-weight:700;font-size:17px;padding:4px 10px 16px}
aside button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--menu-ink);font:inherit;padding:10px 12px;border-radius:8px;cursor:pointer;margin-bottom:2px}
aside button:hover{background:rgba(255,255,255,.07)}
aside button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
main{flex:1;min-width:0;padding:20px 24px 60px}
#topo{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
#topo h1{margin:0;font-size:22px}
.sync{font-size:13px;color:var(--quiet);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sync .pt{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--quiet)}
.sync .pt.ok{background:var(--ok)}.sync .pt.erro{background:var(--bad)}.sync .pt.pend{background:var(--warn)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.perigo{background:none;color:var(--bad);border:1px solid var(--bad)}
.btn.peq{padding:6px 10px;font-size:13px}
.barra{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.barra input[type=search]{flex:1;min-width:180px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:70px;resize:vertical}
.caixa-tab{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--quiet);background:var(--soft)}
tbody tr.clic{cursor:pointer}tbody tr.clic:hover{background:var(--soft)}
td.num,th.num{text-align:right}
.vazio{padding:28px;text-align:center;color:var(--quiet)}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:600;background:var(--soft);color:var(--ink)}
.tag.ok{background:rgba(26,127,55,.14);color:var(--ok)}.tag.warn{background:rgba(178,106,0,.15);color:var(--warn)}.tag.bad{background:rgba(198,40,40,.13);color:var(--bad)}
.vermelho{color:var(--bad);font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card .r{font-size:12px;color:var(--quiet);text-transform:uppercase;letter-spacing:.03em}
.card .v{font-size:24px;font-weight:700;margin-top:4px}
.card .v.bad{color:var(--bad)}.card .v.ok{color:var(--ok)}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.bloco{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:16px}
.bloco h3{margin:0 0 10px;font-size:15px}
.bloco ul{margin:0;padding-left:18px}.bloco li{margin:4px 0}
.aviso{background:rgba(178,106,0,.12);border:1px solid rgba(178,106,0,.35);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.kanban{display:grid;grid-template-columns:repeat(6,minmax(150px,1fr));gap:10px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--soft);border-radius:10px;padding:10px;min-height:200px}
.col h4{margin:0 0 8px;font-size:13px;display:flex;justify-content:space-between}
.op{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;cursor:pointer;font-size:14px}
.op b{display:block}.op .m{display:flex;justify-content:space-between;margin-top:8px}
.op .m button{border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:6px;width:34px;height:28px;cursor:pointer;font-size:14px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:10}
.hidden{display:none!important}
.janela{background:var(--card);border-radius:12px;max-width:900px;width:100%;padding:20px 22px}
.janela h2{margin:0 0 14px}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.campo{display:flex;flex-direction:column;gap:4px}
.campo>span{font-size:13px;color:var(--quiet);font-weight:600}
.campo.w2{grid-column:1/-1}
.campo.chk{flex-direction:row;align-items:center;gap:8px}.campo.chk input{width:auto}
.linhas td{padding:4px;border:0}.linhas th{padding:6px 4px;background:none}
.linhas td input,.linhas td select{min-width:70px;padding:6px 8px}
.linhas td.tl{text-align:right;font-weight:600;padding-right:8px}
.linhas .x{border:0;background:none;color:var(--bad);font-size:16px;cursor:pointer}
.info{font-size:20px;font-weight:700}
.acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;justify-content:flex-end}
.acoes .esq{margin-right:auto;display:flex;gap:8px;flex-wrap:wrap}
.filtros button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:20px;cursor:pointer;font:inherit;font-size:13px}
.filtros button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;font-weight:600;z-index:20}
#impressao{display:none}
@media (max-width:760px){
  body{flex-direction:column}
  aside{width:100%;display:flex;overflow-x:auto;padding:8px;gap:4px}
  aside .marca{display:none}
  aside button{white-space:nowrap;width:auto}
  main{padding:14px 16px 60px}
  .duas,.grade{grid-template-columns:1fr}
}
@media print{
  body{display:block;background:#fff;color:#000}
  body>*:not(#impressao){display:none!important}
  #impressao{display:block;font:12px/1.4 Arial,sans-serif;color:#000}
  #impressao table{width:100%;border-collapse:collapse;margin:10px 0}
  #impressao th,#impressao td{border:1px solid #999;padding:5px 7px;white-space:normal;background:none;color:#000}
  #impressao h1{font-size:18px;margin:0}
  #impressao .cab{display:flex;justify-content:space-between;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:10px}
  #impressao .ass{display:flex;gap:40px;margin-top:50px}
  #impressao .ass div{flex:1;border-top:1px solid #000;text-align:center;padding-top:4px}
}
</style>
</head>
<body>
<aside id="menu"></aside>
<main><div id="topo"></div><div id="tela"></div></main>
<div id="modal" class="modal hidden"><div class="janela" id="janela"></div></div>
<div id="dlg" class="modal hidden" style="z-index:30"><div class="janela" style="max-width:460px"><p id="dlgMsg" style="margin-top:0;font-size:16px;white-space:pre-line"></p><input id="dlgIn" class="hidden"><div class="acoes"><button class="btn sec" id="dlgNao">Cancelar</button><button class="btn" id="dlgSim">OK</button></div></div></div>
<div id="toast" class="hidden"></div>
<div id="impressao"></div>
<input type="file" id="arqImport" accept=".json,application/json" class="hidden">
<input type="file" id="arqXml" accept=".xml,text/xml,application/xml" class="hidden">
<input type="file" id="arqFoto" accept="image/jpeg,image/png,image/webp" multiple class="hidden">
<input type="file" id="arqCodigo" accept="image/jpeg,image/png,image/webp" capture="environment" class="hidden">
<script>
"use strict";
/* ================== DADOS ================== */
const COLS=['clientes','fornecedores','produtos','insumos','orcamentos','pedidos','obras','financeiro','movimentos','custos','notas'];
const LS='custocerto_v1', LS_USER='custocerto_usuario';
const ETAPAS=['Aguardando material','Corte','Furação','Dobra','Acabamento','Pronto','Entregue'];
const CATS=['Venda de produto','Serviço de montagem','Matéria-prima','Mão de obra','Terceiros (galvanização/pintura)','Frete','Impostos','Despesas fixas','Pró-labore','Investimentos','Outros'];
let db={config:{empresa:'',cnpj:'',tel:'',endereco:'',imposto:0,comissao:0,margem:20,perda:5,sinal:50,validade:10,vConsumo:10,vCombustivel:6.2,vRefeicao:40,vHospedagem:120,vDiaria:0,vTarifa:1.1,vHora:30,vVaretasKg:50,vTintaM2:0.112,vPotencia:4}};
COLS.forEach(c=>db[c]=[]);
let usuario='';
const estado={tela:'painel',busca:{},filtro:{financeiro:'abertos',orcamentos:'todos'},edit:null,sync:{modo:'local'}};

function carregarLocal(){
  try{const s=localStorage.getItem(LS);if(s){const d=JSON.parse(s);db=Object.assign(db,d);db.config=Object.assign({},{margem:20,perda:5,sinal:50,validade:10,vConsumo:10,vCombustivel:6.2,vRefeicao:40,vHospedagem:120,vDiaria:0,vTarifa:1.1,vHora:30,vVaretasKg:50,vTintaM2:0.112,vPotencia:4},d.config||{});}}catch(e){}
  COLS.forEach(c=>db[c]=db[c]||[]);
  try{usuario=localStorage.getItem(LS_USER)||'';}catch(e){}
}
function salvar(){try{localStorage.setItem(LS,JSON.stringify(db));}catch(e){} agendarArquivo();}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function isoLocal(d){const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10);}
const hoje=()=>isoLocal(new Date());
function addDias(n,base){const d=base?new Date(base+'T12:00:00'):new Date();d.setDate(d.getDate()+n);return isoLocal(d);}
const ativos=c=>db[c].filter(r=>!r.excluido);
const achar=(c,id)=>id?db[c].find(r=>r.id===id&&!r.excluido):null;
const prox=c=>Math.max(0,...db[c].map(r=>+r.numero||0))+1;
const num=v=>+v||0;
const fmt=v=>num(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fnum=v=>num(v).toLocaleString('pt-BR',{maximumFractionDigits:3});
const fdata=d=>d?d.split('-').reverse().join('/'):'';
const esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const horaAgora=()=>new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});

function gravar(c,r){
  r.alterado=Date.now();r.por=usuario||'';
  if(!r.id){r.id=uid();r.criado=Date.now();db[c].push(r);}
  else{const i=db[c].findIndex(x=>x.id===r.id);if(i>=0)db[c][i]=r;else db[c].push(r);}
  salvar();enviarNuvem(c,r);return r;
}
function excluir(c,id){const r=db[c].find(x=>x.id===id);if(!r)return;r.excluido=true;r.alterado=Date.now();r.por=usuario;salvar();enviarNuvem(c,r);}

/* ================== NUVEM (quando aberto pelo link) ================== */
let nuvem=null,filaNuvem=Promise.resolve();
function filaSet(caminho,corpo){
  if(!nuvem)return;const dados=JSON.parse(JSON.stringify(corpo));
  filaNuvem=filaNuvem.then(()=>nuvem.doc(caminho).set(dados)).catch(e=>{
    estado.sync={modo:'erro',msg:e&&e.code==='invalid_argument'?'você não tem permissão para gravar (peça acesso de Editor ou Colaborador)':e&&e.code==='quota_exceeded'?'limite de espaço da nuvem atingido':'falha ao gravar, tente de novo'};topo();});
}
function enviarNuvem(c,r){filaSet(c+'/'+r.id,r);}
function enviarTudo(){if(!nuvem)return;COLS.forEach(c=>db[c].forEach(r=>enviarNuvem(c,r)));filaSet('config/geral',db.config);}
function renderSeguro(){const dlg=document.getElementById('dlg');if(!estado.edit&&!estado.calc&&!estado.nota&&!estado.ficha&&dlg.classList.contains('hidden')&&!(document.activeElement&&document.activeElement.type==='search'))render();else topo();}
async function iniciarNuvem(){
  for(let i=0;i<15&&!(window.claude&&window.claude.use);i++)await new Promise(r=>setTimeout(r,100));
  if(!(window.claude&&window.claude.use))return false;
  let d=null;try{d=await window.claude.use('db');}catch(e){}
  if(!d)return false;
  nuvem=d;COLS.forEach(c=>db[c]=[]);estado.sync={modo:'carregando'};render();
  const faltam=new Set(COLS);
  const timer=setTimeout(()=>{if(faltam.size){estado.sync={modo:'erro',msg:'a nuvem ainda não respondeu; os dados podem estar incompletos'};topo();}},10000);
  const erro=e=>{clearTimeout(timer);estado.sync={modo:'erro',msg:'conexão com a nuvem perdida ('+(e&&e.code)+'). Recarregue a página.'};topo();};
  COLS.forEach(c=>nuvem.collection(c).onSnapshot(s=>{
    db[c]=s.docs.map(x=>JSON.parse(JSON.stringify(x.data())));
    if(!s.metadata.fromCache)faltam.delete(c);
    if(!faltam.size){clearTimeout(timer);estado.sync={modo:'nuvem',hora:horaAgora()};}
    renderSeguro();
  },erro));
  nuvem.doc('config/geral').onSnapshot(s=>{if(s.exists)db.config=Object.assign({},db.config,JSON.parse(JSON.stringify(s.data())));renderSeguro();},erro);
  return true;
}

/* ================== CAIXAS DE DIÁLOGO ================== */
function dialogo(msg,o){o=o||{};return new Promise(res=>{
  const d=document.getElementById('dlg'),inp=document.getElementById('dlgIn'),sim=document.getElementById('dlgSim'),nao=document.getElementById('dlgNao');
  document.getElementById('dlgMsg').textContent=msg;inp.value='';inp.classList.toggle('hidden',!o.entrada);nao.classList.toggle('hidden',!!o.soOk);
  d.classList.remove('hidden');setTimeout(()=>(o.entrada?inp:sim).focus(),30);
  const fim=v=>{d.classList.add('hidden');sim.onclick=nao.onclick=inp.onkeydown=null;res(v);};
  sim.onclick=()=>fim(o.entrada?inp.value:true);nao.onclick=()=>fim(o.entrada?null:false);
  inp.onkeydown=e=>{if(e.key==='Enter')fim(inp.value);};
});}
const perguntar=m=>dialogo(m),pedirTexto=m=>dialogo(m,{entrada:true}),aviso=m=>dialogo(m,{soOk:true});

function nomeRef(c,id){
  const r=achar(c,id);if(!r)return '';
  if(c==='pedidos'||c==='orcamentos'){const cl=achar('clientes',r.cliente);return `#${r.numero} — ${cl?cl.nome:''}`;}
  return r.nome||'';
}
function opcoesRef(c,v){
  const lista=ativos(c).slice().sort((a,b)=>nomeRef(c,a.id).localeCompare(nomeRef(c,b.id)));
  return '<option value=""></option>'+lista.map(r=>`<option value="${r.id}" ${r.id===v?'selected':''}>${esc(nomeRef(c,r.id))}</option>`).join('');
}
const totalItens=it=>(it||[]).reduce((s,x)=>s+num(x.qtd)*num(x.preco),0);
const totalDoc=r=>totalItens(r.itens)+num(r.frete)-num(r.desconto);
const atrasado=p=>p.etapa!=='Entregue'&&p.entrega&&p.entrega<hoje();

/* ================== MEDIDAS / CORTE ================== */
const MEDIDAS=['Não é cortado (usa inteiro)','Chapa (corte por área)','Barra / perfil (corte por comprimento)'];
const ehChapa=i=>String(i.medida||'').startsWith('Chapa'),ehBarra=i=>String(i.medida||'').startsWith('Barra');
// quanto do material (na unidade do estoque) gasta uma peça de L x C cm
function qtdPeca(i,L,C){
  const u=String(i.unidade||'').toLowerCase();L=num(L);C=num(C);
  if(ehChapa(i)){const a=L*C/10000;if(u==='kg')return a*num(i.esp)*7.85;if(u==='m²')return a;const b=num(i.larg)*num(i.comp)/10000;return b?a/b:0;}
  if(ehBarra(i)){const m=C/100;if(u==='kg')return m*num(i.kgm);if(u==='metro')return m;const b=num(i.comp)/100;return b?m/b:0;}
  return 0;
}
function textoBase(i){
  if(!num(i.custo))return 'Coloque o custo por unidade (ou dê entrada por nota fiscal).';
  if(ehChapa(i)){const q=qtdPeca(i,100,100);if(!q)return String(i.unidade).toLowerCase()==='kg'?'Preencha a espessura da chapa (mm).':'Preencha a largura e o comprimento da chapa inteira.';
    const m2=q*num(i.custo);return `1 m² custa ${fmt(m2)} · 10 cm × 10 cm custa ${fmt(m2/100)}`;}
  if(ehBarra(i)){const q=qtdPeca(i,0,100);if(!q)return String(i.unidade).toLowerCase()==='kg'?'Preencha o peso por metro (kg/m).':'Preencha o comprimento da barra inteira.';
    const m=q*num(i.custo);return `1 metro custa ${fmt(m)} · 10 cm custa ${fmt(m/10)}`;}
  return 'Material usado inteiro: o custo é por '+(i.unidade||'unidade')+'.';
}

function metragem(i){
  if(ehChapa(i)){const q=qtdPeca(i,100,100);return q?fnum(Math.round(num(i.qtd)/q*100)/100)+' m²':'';}
  if(ehBarra(i)){const q=qtdPeca(i,0,100);return q?fnum(Math.round(num(i.qtd)/q*100)/100)+' m':'';}
  return '';
}
function telaConsumo(){
  const mes=estado.mesConsumo||hoje().slice(0,7);
  const sai=ativos('movimentos').filter(m=>m.tipo==='Saída'&&(m.data||'').startsWith(mes)).sort((a,b)=>(b.data||'').localeCompare(a.data||'')||num(b.criado)-num(a.criado));
  const val=m=>num(m.qtd)*num(m.custo!=null?m.custo:(achar('insumos',m.insumo)||{}).custo);
  const tot=sai.reduce((s,m)=>s+val(m),0);
  const por={};sai.forEach(m=>{const o=por[m.insumo]=por[m.insumo]||{q:0,v:0};o.q+=num(m.qtd);o.v+=val(m);});
  const ids=Object.keys(por).sort((a,b)=>por[b].v-por[a].v);
  return `<div class="barra"><label class="campo" style="max-width:220px"><span>Mês</span><input type="month" value="${mes}" onchange="estado.mesConsumo=this.value;render()"></label></div>
  <div class="cards"><div class="card"><div class="r">Consumido no mês (valor)</div><div class="v">${fmt(tot)}</div></div><div class="card"><div class="r">Saídas no mês</div><div class="v">${sai.length}</div></div></div>
  <div class="bloco"><h3>Resumo do mês por item</h3>${ids.length?`<table><thead><tr><th>Item de produção</th><th class="num">Quantidade usada</th><th class="num">Valor</th></tr></thead><tbody>${ids.map(id=>{const i=achar('insumos',id)||{};return `<tr><td>${esc(i.nome||'(item excluído)')}</td><td class="num">${fnum(Math.round(por[id].q*1000)/1000)} ${esc(i.unidade||'')}</td><td class="num">${fmt(por[id].v)}</td></tr>`;}).join('')}</tbody></table>`:'<p style="color:var(--quiet);margin:0">Nada consumido neste mês.</p>'}</div>

/* ================== AÇÕES ================== */
// quanto de um item de produção (na unidade do estoque) uma linha da ficha gasta
function consumoFicha(f){const i=achar('insumos',f.insumo);if(!i)return 0;return (ehChapa(i)||ehBarra(i))&&(num(f.larg)||num(f.comp))?qtdPeca(i,f.larg,f.comp)*num(f.qtd):num(f.qtd);}
function custoFicha(ficha){return (ficha||[]).reduce((s,f)=>{const i=achar('insumos',f.insumo);return s+(i?num(i.custo)*consumoFicha(f):0);},0)*(1+num(db.config.perda)/100);}
// tudo que um pedido consome do estoque: ficha de cada produto + itens a mais do cálculo de custo (com perda)
function consumoPedido(p){
  const perda=1+num(db.config.perda)/100,m={};
  (p.itens||[]).forEach(it=>{const pr=achar('produtos',it.prod);if(!pr)return;const c=custoProduto(pr);Object.keys(c.mats).forEach(id=>{m[id]=(m[id]||0)+c.mats[id]*num(it.qtd);});});
  const c=p.orcamento&&ativos('custos').find(x=>x.orcamento===p.orcamento);
  if(c)(c.linhas||[]).forEach(l=>{const x=calcLinhaS(l);if(x.mat&&x.ins&&x.q)m[x.ins.id]=(m[x.ins.id]||0)+x.q*perda;});
  Object.keys(m).forEach(k=>{m[k]=Math.round(m[k]*10000)/10000;if(!m[k])delete m[k];});
  return m;
}
function precoSugerido(mat,mo,margem){const d=1-(num(db.config.imposto)+num(db.config.comissao)+num(margem))/100;return d>0?(num(mat)+num(mo))/d:0;}

function aplicarBaixa(p){
  if(p.baixado||ETAPAS.indexOf(p.etapa)<ETAPAS.indexOf('Corte'))return;
  const m=consumoPedido(p);
  Object.keys(m).forEach(id=>{const ins=JSON.parse(JSON.stringify(achar('insumos',id)));const q=m[id];
    ins.qtd=Math.round((num(ins.qtd)-q)*10000)/10000;gravar('insumos',ins);
    gravar('movimentos',{insumo:id,tipo:'Saída',qtd:q,custo:num(ins.custo),data:hoje(),pedido:p.id,motivo:`Consumo no pedido #${p.numero}`});});
  p.baixado=true;
}

const ACOES={
  calcPreco(r){
    if(r.fichaCusto&&r.fichaCusto.length){const rf=resumoFicha(r.fichaCusto);setCampo('custoMat',rf.mat.toFixed(2));setCampo('custoMO',rf.out.toFixed(2));const pf=precoSugerido(rf.mat,rf.out,r.margem);setCampo('preco',pf.toFixed(2));toast('Preço sugerido pela ficha de custo: '+fmt(pf));return;}
    const mat=r.ficha&&r.ficha.some(f=>f.insumo)?custoFicha(r.ficha):num(r.custoMat);
    const p=precoSugerido(mat,r.custoMO,r.margem);
    setCampo('custoMat',mat.toFixed(2));setCampo('preco',p.toFixed(2));
    toast(`Preço sugerido: ${fmt(p)}`);
  },
  imprimirOrc(r){r.total=totalDoc(r);if(!validar(r))return;gravar('orcamentos',r);estado.edit.r=r;imprimir(docOrcamento(r),`orcamento-${r.numero}`);},
  aprovar(r){
    if(!validar(r))return;
    r.status='Aprovado';r.total=totalDoc(r);gravar('orcamentos',r);
    let p=ativos('pedidos').find(x=>x.orcamento===r.id);
    if(!p){
      p=gravar('pedidos',{numero:prox('pedidos'),data:hoje(),cliente:r.cliente,orcamento:r.id,itens:JSON.parse(JSON.stringify(r.itens||[])),frete:r.frete,desconto:r.desconto,total:r.total,entrega:addDias(15),etapa:'Aguardando material',montagem:(r.itens||[]).some(i=>{const pr=achar('produtos',i.prod);return pr&&pr.tipo==='Serviço de montagem';}),obs:[r.obra?('Obra: '+r.obra):'',r.obs||''].filter(Boolean).join('\n')});
      lancarCobrancas(p,true);
      toast(`Pedido #${p.numero} criado, com as cobranças no financeiro`);
    }
    fecharModal();ir('pedidos');abrirForm('pedidos',p.id);
  },
  imprimirOP(r){if(!validar(r))return;MOD.pedidos.antes(r);gravar('pedidos',r);estado.edit.r=r;imprimir(docOP(r),`ordem-producao-${r.numero}`);},
  criarObra(r){
    if(!validar(r))return;MOD.pedidos.antes(r);gravar('pedidos',r);
    const orc=achar('orcamentos',r.orcamento),cl=achar('clientes',r.cliente);
    const o=gravar('obras',{pedido:r.id,data:r.entrega,endereco:(orc&&orc.obra)||(cl&&cl.endereco)||'',contato:cl?((cl.nome||'')+' '+(cl.tel||'')):'',status:'Agendada'});
    fecharModal();ir('obras');abrirForm('obras',o.id);
  },
  async cobrancas(r){
    if(!validar(r))return;MOD.pedidos.antes(r);gravar('pedidos',r);
    const ja=ativos('financeiro').filter(f=>f.pedido===r.id&&f.tipo==='A receber');
    if(ja.length&&!(await perguntar(`Este pedido já tem ${ja.length} cobrança(s) lançada(s). Lançar de novo?`)))return;
    lancarCobrancas(r,false);toast('Cobranças lançadas no financeiro');
  },
  custo(r){
    if(!validar(r))return;
    const c=estado.edit.c;if(c==='orcamentos')r.total=totalDoc(r);else MOD.pedidos.antes(r);gravar(c,r);
    const orcId=c==='orcamentos'?r.id:r.orcamento;
    fecharModal();const ja=ativos('custos').find(x=>x.orcamento===orcId);
    abrirCalc(ja?ja.id:null,orcId);
  },
  fichaCusto(r){
    if(!validar(r))return;const p=gravar('produtos',r);fecharModal();abrirFicha(p.id);
  },
  entrada(r){movEstoque(r,1);},
  saida(r){movEstoque(r,-1);},
};
function lancarCobrancas(p,silencioso){
  const tot=num(p.total);if(tot<=0)return;
  const s=Math.min(100,Math.max(0,num(db.config.sinal)));
  const sinal=Math.round(tot*s)/100, resto=Math.round((tot-sinal)*100)/100;
  if(sinal>0)gravar('financeiro',{tipo:'A receber',categoria:'Venda de produto',descricao:`Sinal do pedido #${p.numero}`,valor:sinal,venc:hoje(),pedido:p.id});
  if(resto>0)gravar('financeiro',{tipo:'A receber',categoria:'Venda de produto',descricao:`Restante do pedido #${p.numero}`,valor:resto,venc:p.entrega||hoje(),pedido:p.id});
}
async function movEstoque(r,sinal){
  const base=Object.assign({},r,lerForm(MOD.insumos));
  const t=await pedirTexto(sinal>0?'Quantidade que ENTROU no estoque:':'Quantidade que SAIU do estoque:');if(t===null)return;
  const q=num(String(t).replace(',','.'));if(!q){aviso('Quantidade inválida.');return;}
  const motivo=(await pedirTexto('Motivo ou número da nota fiscal (opcional):'))||'';
  const novo=base;novo.qtd=num(novo.qtd)+sinal*q;gravar('insumos',novo);
  gravar('movimentos',{insumo:novo.id,tipo:sinal>0?'Entrada':'Saída',qtd:q,data:hoje(),motivo});
  abrirForm('insumos',novo.id);render();toast('Estoque atualizado');
}

function mover(id,d){const p=achar('pedidos',id);if(!p)return;const i=Math.min(ETAPAS.length-1,Math.max(0,ETAPAS.indexOf(p.etapa)+d));p.etapa=ETAPAS[i];MOD.pedidos.antes(p);gravar('pedidos',p);render();}

function campoHTML(f,r){
  const v=r[f.k],cls=`campo ${f.w?'w2':''}`,lab=`<span>${esc(f.l)}${f.req?' *':''}</span>`;
  switch(f.t){
    case 'sel':return `<label class="${cls}">${lab}<select name="${f.k}">${f.o.map(o=>`<option ${o===(v??f.o[0])?'selected':''}>${esc(o)}</option>`).join('')}</select></label>`;
    case 'ref':return `<label class="${cls}">${lab}<select name="${f.k}">${opcoesRef(f.col,v)}</select></label>`;
    case 'area':return `<label class="${cls}">${lab}<textarea name="${f.k}">${esc(v)}</textarea></label>`;
    case 'chk':return `<label class="${cls} chk"><input type="checkbox" name="${f.k}" ${v?'checked':''}>${lab}</label>`;
    case 'ro':return `<label class="${cls}">${lab}<input name="${f.k}" value="${esc(v)}" readonly></label>`;
    case 'info':return `<div class="${cls}">${lab}<div class="info" id="info_${f.k}"></div></div>`;
    case 'linhas':return `<div class="campo w2">${lab}<div class="linhas caixa-tab" data-k="${f.k}"><table><thead><tr>${f.sub.map(s=>`<th>${esc(s.l)}</th>`).join('')}${f.total?'<th class="num">Total</th>':''}<th></th></tr></thead><tbody>${(v||[]).map(x=>linhaHTML(f,x)).join('')}</tbody></table><div style="padding:8px"><button type="button" class="btn sec peq" onclick="addLinha('${f.k}')">+ Adicionar linha</button></div></div></div>`;
    default:{const tp=f.t==='date'?'date':(f.t==='num'||f.t==='money')?'number':'text';
      return `<label class="${cls}">${lab}<input name="${f.k}" type="${tp}" ${tp==='number'?'step="any"':''} value="${esc(v)}"></label>`;}
  }
}
function linhaHTML(f,x){x=x||{};
  return `<tr>${f.sub.map(s=>`<td>${s.t==='ref'?`<select data-c="${s.k}">${opcoesRef(s.col,x[s.k])}</select>`:`<input data-c="${s.k}" type="${s.t==='num'||s.t==='money'?'number':'text'}" step="any" value="${esc(x[s.k])}">`}</td>`).join('')}${f.total?`<td class="tl">${fmt(num(x.qtd)*num(x.preco))}</td>`:''}<td><button type="button" class="x" title="Remover" onclick="this.closest('tr').remove();recalc()">✕</button></td></tr>`;
}
function addLinha(k){const f=MOD[estado.edit.c].campos.find(x=>x.k===k);document.querySelector(`.linhas[data-k="${k}"] tbody`).insertAdjacentHTML('beforeend',linhaHTML(f,{qtd:1}));}
function lerLinhas(f){
  return [...document.querySelectorAll(`.linhas[data-k="${f.k}"] tbody tr`)].map(tr=>{const o={};
    f.sub.forEach(s=>{const el=tr.querySelector(`[data-c="${s.k}"]`);o[s.k]=(s.t==='num'||s.t==='money')?num(el.value):el.value;});return o;})
    .filter(o=>f.sub.some(s=>s.t!=='num'&&s.t!=='money'&&o[s.k]));
}
function lerForm(m){
  const fm=document.getElementById('f'),o={};

    if(f.t==='info')return;

function setCampo(k,v){const el=document.getElementById('f').elements[k];if(el)el.value=v;recalc();}
function lerEdicao(){const {c,r}=estado.edit,m=MOD[c];const n=Object.assign({},r,lerForm(m));if(m.antes)m.antes(n);return n;}
function validar(r){const m=MOD[estado.edit.c];const f=m.campos.find(f=>f.req&&(r[f.k]===''||r[f.k]==null));if(f){aviso(`Preencha o campo: ${f.l}`);return false;}return true;}
function recalc(){

  document.querySelectorAll('.linhas tbody tr').forEach(tr=>{const td=tr.querySelector('.tl');if(td)td.textContent=fmt(num(tr.querySelector('[data-c=qtd]').value)*num(tr.querySelector('[data-c=preco]').value));});

const ESP_PROD=['Tempo de trabalho'],ESP_ENT=['Montagem na obra','Deslocamento','Transportadora'];
const ESPECIAIS=[[/^(tempo|m[aã]o de obra|energia)/i,'tempo'],[/montagem/i,'montagem'],[/desloc|viagem|^km/i,'desloc'],[/transport|frete/i,'transp']];
const r4=v=>Math.round(v*10000)/10000;
const numsDe=s=>(String(s||'').replace(/(\d),(\d)/g,'$1.$2').match(/\d+(\.\d+)?/g)||[]).map(Number);
function resolverLinha(l){
  const n=String(l.nome||'').trim(),low=n.toLowerCase();l.especial='';l.insumo='';
  for(const [re,t] of ESPECIAIS)if(re.test(n)){l.especial=t;return l;}
  const ins=ativos('insumos').find(i=>i.nome.toLowerCase()===low)||(low.length>=3?ativos('insumos').find(i=>i.nome.toLowerCase().includes(low)):null);
  if(ins)l.insumo=ins.id;
  return l;
}
function calcLinhaS(l){
  const c=db.config,i=achar('insumos',l.insumo),qt=l.qtd===''||l.qtd==null?1:num(l.qtd),ns=numsDe(l.medida),s=String(l.medida||'').toLowerCase();
  let q=0,custo=0,txt='',mat=false,manual=false;
  if(i){
    mat=true;const u=String(i.unidade||'').toLowerCase(),nm=i.nome.toLowerCase();
    if(ehChapa(i)){const L=ns[0]||0,C=ns.length>1?ns[1]:L;q=qtdPeca(i,L,C)*qt;
      txt=qtdPeca(i,100,100)?`${fnum(r4(L*C/1e4*qt))} m² = ${fnum(r4(q))} ${u}`:'Cadastre o tamanho da chapa em Itens de produção';}
    else if(ehBarra(i)){const C=ns.length?ns[ns.length-1]:0;q=qtdPeca(i,0,C)*qt;
      txt=qtdPeca(i,0,100)?`${fnum(r4(C/100*qt))} m = ${fnum(r4(q))} ${u}`:'Cadastre o comprimento da barra em Itens de produção';}
    else if(u==='kg'&&/eletrodo|vareta/.test(nm)){const vk=num(c.vVaretasKg)||50,v=(ns.length?ns[0]:1)*qt;q=v/vk;txt=`${fnum(v)} vareta(s) = ${fnum(r4(q))} kg`;}
    else if(/tinta/.test(nm)&&(u==='kg'||u==='litro')){const a=(ns.length?ns[0]:0)*qt;q=a*(num(c.vTintaM2)||0.112);txt=`${fnum(a)} m² pintados = ${fnum(r4(q))} ${u}`;}
    else{q=(ns.length?ns[0]:1)*qt;txt=`${fnum(r4(q))} ${u}`;}
    custo=q*num(i.custo);txt=i.nome+' · '+txt+(num(i.custo)?` · ${fmt(i.custo)} por ${u}`:' · SEM PREÇO: dê entrada pela nota');
  }else if(l.especial==='tempo'){
    const min=/h/.test(s)&&!/min/.test(s)?(ns[0]||0)*60:(ns[0]||0),h=min/60*qt,mo=h*num(c.vHora),en=h*num(c.vPotencia)*num(c.vTarifa);
    custo=mo+en;txt=`${fnum(Math.round(h*100)/100)} h · mão de obra ${fmt(mo)} + energia ${fmt(en)}`;
  }else if(l.especial==='montagem'){
    const h=/min/.test(s)?(ns[0]||0)/60:(ns[0]||0);custo=h*qt*num(c.vHora);txt=`${fnum(h)} h × ${fnum(qt)} pessoa(s) a ${fmt(c.vHora)}/hora`;
  }else if(l.especial==='desloc'){
    const km=(ns[0]||0)*2*qt,lt=num(c.vConsumo)?km/num(c.vConsumo):0;custo=lt*num(c.vCombustivel);txt=`${fnum(km)} km ida e volta · ${fnum(Math.round(lt*10)/10)} litros`;
  }else{manual=true;custo=num(l.valor);txt=l.especial==='transp'?'frete: digite o valor':(l.nome?'item fora do estoque: digite o valor':'');}
  return {q,custo,mat,manual,ins:i,txt};
}
function resumoLista(ls){let m=0,o=0;(ls||[]).forEach(l=>{const x=calcLinhaS(l);if(x.mat)m+=x.custo;else o+=x.custo;});m*=1+num(db.config.perda)/100;return {mat:m,out:o,total:m+o};}

function dicaMedida(l){

let falaApi=null,vozApi=null,falaLid='',falaNativa=null;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const micDisponivel=()=>!!(falaApi||SR),vozDisponivel=()=>!!(vozApi||window.speechSynthesis);
async function prepararVoz(){
  try{if(!(window.claude&&window.claude.use))return;
    const [d,t]=await Promise.all([window.claude.use('dictation').catch(()=>null),window.claude.use('tts').catch(()=>null)]);
    vozApi=t||null;
    if(d){falaApi=d;d.onPartial(({text})=>mostrarFala(text));d.onFinal(({text})=>receberFala(text));d.onState(({state})=>{if(state==='idle'&&falaLid){falaLid='';redesenharFala();}});}
    if(d||t)redesenharFala();
  }catch(e){}
}
function redesenharFala(){if(estado.ficha||estado.calc){lerTelaS();redesenharS();}}
function micHTML(lid){
  if(!micDisponivel())return '';
  return `<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px"><button type="button" class="btn ${falaLid===lid?'perigo':'sec'} peq" onclick="falarS('${lid}')">${falaLid===lid?'⏹ Parar de ouvir':'🎤 Falar os itens'}</button><span id="fala_${lid}" style="color:var(--quiet);font-size:13px">${falaLid===lid?'Pode falar. Ex.: "chapa 10 por 20", "dois discos de corte", "tempo de trabalho 30 minutos"':''}</span></div>`;
}
function falarS(lid){
  if(falaLid){const era=falaLid;pararFala();if(era===lid)return;}
  falaLid=lid;
  if(falaApi){falaApi.start().catch(e=>{falaLid='';redesenharFala();if(e&&e.code==='not_granted')aviso('O microfone não foi liberado. Libere no menu de permissões da página para ditar os itens.');});}
  else if(SR){const r=new SR();r.lang='pt-BR';r.continuous=true;r.interimResults=true;
    r.onresult=ev=>{let p='';for(let k=ev.resultIndex;k<ev.results.length;k++){const x=ev.results[k];if(x.isFinal)receberFala(x[0].transcript);else p+=x[0].transcript;}if(p)mostrarFala(p);};
    r.onend=()=>{falaNativa=null;if(falaLid){falaLid='';redesenharFala();}};
    r.onerror=ev=>{if(ev.error==='not-allowed'||ev.error==='service-not-allowed')aviso('O navegador não liberou o microfone. Use o Chrome e permita o microfone.');};
    falaNativa=r;try{r.start();}catch(e){}}
  redesenharFala();
}
function pararFala(){falaLid='';if(falaApi)falaApi.stop().catch(()=>{});if(falaNativa){try{falaNativa.stop();}catch(e){}falaNativa=null;}redesenharFala();}
function mostrarFala(t){const el=document.getElementById('fala_'+falaLid);if(el&&t)el.textContent='Ouvindo: '+t;}
function receberFala(text){
  if(!falaLid||!(falaLid==='f'?estado.ficha:estado.calc)){pararFala();return;}
  if(/^\s*(pare|parar|chega|terminei)[.!]?\s*$/i.test(text)){pararFala();return;}
  const ls=entenderFala(text);if(!ls.length)return;
  const lid=falaLid;lerTelaS();const arr=LISTA(lid);ls.forEach(l=>arr.push(l));redesenharS();
  const el=document.getElementById('fala_'+lid);
  if(el)el.textContent='Entendi: '+ls.map(l=>l.nome+(l.medida?' '+l.medida:'')+(num(l.qtd)!==1?' × '+fnum(l.qtd):'')+(l.valor!==''?' '+fmt(l.valor):'')).join(' · ');
}
const NUMS={zero:0,um:1,uma:1,dois:2,duas:2,'três':3,tres:3,quatro:4,cinco:5,seis:6,sete:7,oito:8,nove:9,dez:10,onze:11,doze:12,treze:13,catorze:14,quatorze:14,quinze:15,dezesseis:16,dezessete:17,dezoito:18,dezenove:19,vinte:20,trinta:30,quarenta:40,cinquenta:50,sessenta:60,setenta:70,oitenta:80,noventa:90,cem:100,cento:100,duzentos:200,duzentas:200,trezentos:300,trezentas:300,quatrocentos:400,quinhentos:500,seiscentos:600,setecentos:700,oitocentos:800,novecentos:900,mil:1000,meia:0.5,meio:0.5};
function palavrasNum(s){
  const w=s.split(/\s+/).filter(Boolean),out=[];let acc=null;
  for(let k=0;k<w.length;k++){const x=w[k],v=NUMS[x];
    if(v!=null){acc=x==='mil'?(acc||1)*1000:(acc||0)+v;continue;}
    if(x==='e'&&acc!=null&&NUMS[w[k+1]]!=null)continue;
    if(acc!=null){out.push(String(acc));acc=null;}out.push(x);}
  if(acc!=null)out.push(String(acc));
  return out.join(' ');
}
const semAc=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const raizP=w=>w.replace(/oes$|aes$/,'ao').replace(/eis$/,'el').replace(/s$/,'');
function acharPorFala(nome){
  const ws=semAc(nome).split(/[^a-z0-9]+/).filter(w=>w.length>=3&&!['com','para','das','dos','uma'].includes(w)).map(raizP);
  if(!ws.length)return null;let best=null,bs=0;
  ativos('insumos').forEach(i=>{const iw=semAc(i.nome).split(/[^a-z0-9]+/).filter(Boolean).map(raizP);
    const sc=ws.filter(w=>iw.some(x=>x===w||(x.length>=4&&w.length>=4&&(x.startsWith(w)||w.startsWith(x))))).length/ws.length;
    if(sc>bs){bs=sc;best=i;}});
  return bs>=0.5?best:null;
}
function entenderFala(text){
  let s=String(text||'').toLowerCase().replace(/r\$\s*/g,' ').replace(/(\d)\.(\d{3})(?!\d)/g,'$1$2').replace(/(\d),(\d)/g,'$1.$2').replace(/[;!?]|,\s|\.\s|\.$/g,' , ');
  s=palavrasNum(s).replace(/(\d)\s*(?:por|x|vezes)\s*(\d)/g,'$1x$2').replace(/(\d+(?:\.\d+)?)\s*(?:horas?|h)\s+e\s+0\.5(?![\d])/g,(a,n)=>(+n+0.5)+' h').replace(/(\d+)\s*(?:reais|real)\s+e\s+(\d+)\s*centavos?/g,(a,r,c)=>(+r+c/100)+' reais');
  return s.split(/\s*,\s*|\s+(?:e|mais|depois)\s+(?=[a-zà-ú\d])/).map(p=>linhaDaFala(p.trim())).filter(Boolean);
}
function linhaDaFala(p){
  if(!p)return null;let qtd=1,valor='',m;
  if((m=p.match(/^(\d+(?:\.\d+)?)\s+([a-zà-ú].*)$/))&&!/^(cm|cent|metro|mm|min|hora|h\b|km|quil|reais|real|pessoa|viage)/.test(m[2])){qtd=+m[1];p=m[2];}
  if((m=p.match(/(\d+(?:\.\d+)?)\s*(?:pessoas?|viage(?:m|ns))/))){qtd=+m[1];p=p.replace(m[0],' ');}
  if((m=p.match(/(\d+(?:\.\d+)?)\s*(?:reais|real)(?:\s+e\s+(\d+)\s*centavos?)?/))){valor=+m[1]+(m[2]?+m[2]/100:0);p=p.replace(m[0],' ');}
  p=p.replace(/\s+/g,' ').trim();
  const d=p.search(/\d/);let nome=(d<0?p:p.slice(0,d)).replace(/\s(de|com|a|o|em|no|na)\s*$/,'').trim(),medida=d<0?'':p.slice(d).trim();
  if(!nome&&(m=medida.match(/^([\d.x]+(?:\s+[\d.x]+)*\s*[a-zà-ú]{0,12})\s+(?:de|do|da)\s+(.+)$/))){medida=m[1];nome=m[2];}
  medida=medida.replace(/(cent[íi]metros?|cent)(?![a-z])/g,'cm').replace(/quil[ôo]metros?/g,'km').replace(/minutos?/g,'min').replace(/horas?/g,'h').replace(/metros?(?![a-z])/g,'m').replace(/\s+(de|da|do)\s*$/,'');
  if(!nome)return null;
  nome=nome.charAt(0).toUpperCase()+nome.slice(1);
  let l={nome,medida,qtd,valor:''};
  if(!ESPECIAIS.some(([re])=>re.test(nome))){const i=acharPorFala(nome);if(i)l.nome=i.nome;}
  resolverLinha(l);
  if(!l.insumo&&!['tempo','montagem','desloc'].includes(l.especial)){
    const n=numsDe(medida);if(valor===''&&n.length&&!l.especial&&/^[\d.\s]+$/.test(medida))valor=n[0];
    if(valor!==''&&numsDe(medida).length)l.medida=medida.replace(/[\d.]+/g,'').trim();
  }
  l.valor=valor;
  return l;
}
function falaDinheiro(v){v=Math.round(num(v)*100);const a=Math.abs(v),r=Math.floor(a/100),c=a%100;
  return (v<0?'menos ':'')+(r?r+(r===1?' real':' reais'):'')+(r&&c?' e ':'')+(c?c+(c===1?' centavo':' centavos'):'')+(!r&&!c?'zero reais':'');}
function falar(t){
  t=String(t).slice(0,1990);
  if(vozApi){vozApi.speak(t,{language:'pt-BR'}).catch(e=>{if(e&&e.code==='not_granted'){vozApi=null;falar(t);}});return;}
  if(window.speechSynthesis){const ss=window.speechSynthesis;ss.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';
    const v=ss.getVoices().find(x=>/^pt/i.test(x.lang));if(v)u.voice=v;ss.speak(u);return;}
  aviso('Este navegador não consegue falar. Use o Chrome.');
}

  falar(`${p.nome}. ${its} Materiais com perda: ${falaDinheiro(r.mat)}. Tempo e outros: ${falaDinheiro(r.out)}. Custo de uma unidade: ${falaDinheiro(r.total)}. Preço de venda sugerido: ${falaDinheiro(precoSugerido(r.mat,r.out,f.margem))}.`);

function puxarOrc(r,orcId){
  const o=achar('orcamentos',orcId);if(!o)return;
  r.orcamento=o.id;r.itens=(o.itens||[]).filter(i=>i.prod).map(i=>({prod:i.prod,qtd:num(i.qtd)}));

// custo de 1 unidade de um produto e o que ele gasta do estoque (já com perda)
function custoProduto(p){
  const perda=1+num(db.config.perda)/100,mats={};let mat=0,out=0;
  if(p.fichaCusto&&p.fichaCusto.length){p.fichaCusto.forEach(l=>{const x=calcLinhaS(l);if(x.mat){mat+=x.custo;if(x.ins&&x.q)mats[x.ins.id]=(mats[x.ins.id]||0)+x.q*perda;}else out+=x.custo;});mat*=perda;}
  else if((p.ficha||[]).some(f=>achar('insumos',f.insumo))){p.ficha.forEach(f=>{const i=achar('insumos',f.insumo);if(!i)return;const q=consumoFicha(f);mat+=q*num(i.custo);mats[i.id]=(mats[i.id]||0)+q*perda;});mat*=perda;out=num(p.custoMO);}
  else{mat=num(p.custoMat);out=num(p.custoMO);}
  return {mat,out,mats};
}
function calcular(r){
  const perda=1+num(db.config.perda)/100,est={};let prodMat=0,prodOut=0,linMat=0,linOut=0;
  const add=(id,q)=>{est[id]=(est[id]||0)+q;};
  (r.itens||[]).forEach(it=>{const p=achar('produtos',it.prod);if(!p)return;const q=num(it.qtd),c=custoProduto(p);prodMat+=c.mat*q;prodOut+=c.out*q;Object.keys(c.mats).forEach(id=>add(id,c.mats[id]*q));});
  (r.linhas||[]).forEach(l=>{const x=calcLinhaS(l);if(x.mat){linMat+=x.custo;if(x.ins&&x.q)add(x.ins.id,x.q*perda);}else linOut+=x.custo;});linMat*=perda;
  const entrega=(r.entrega||[]).reduce((s,l)=>s+calcLinhaS(l).custo,0);
  const materiais=Object.keys(est).map(id=>{const i=achar('insumos',id);return {nome:i.nome,un:i.unidade||'',unit:num(i.custo),qtd:est[id],est:num(i.qtd),total:est[id]*num(i.custo)};});
  const producao=prodMat+prodOut+linMat+linOut,total=producao+entrega;
  return {materiais,prodMat,prodOut,linMat,linOut,producao,entrega,total,sugerido:precoSugerido(total,0,r.margem)};
}

let leitorFoto=null,lendoFoto=null;
const UNID={KG:'kg',KGS:'kg',M2:'m²','M²':'m²',M:'metro',MT:'metro',MTS:'metro',ML:'metro',METRO:'metro',CH:'chapa',CHP:'chapa',CHAPA:'chapa',BR:'barra',BARRA:'barra',BRR:'barra',CT:'cento',CENTO:'cento',L:'litro',LT:'litro',LITRO:'litro',BOB:'bobina',BOBINA:'bobina'};
const unidade=u=>UNID[String(u||'').toUpperCase().replace(/[^A-Z²0-9]/g,'')]||'peça';
const soNum=s=>String(s||'').replace(/\D/g,'');
function acharInsumo(cnpj,cod,desc){
  const chave=soNum(cnpj)+':'+cod,d=String(desc||'').trim().toLowerCase();
  const i=ativos('insumos').find(x=>(x.codigos||[]).includes(chave))||ativos('insumos').find(x=>String(x.nome||'').trim().toLowerCase()===d);
  return i?i.id:'__novo';
}
function novaNota(o){
  o=o||{};const n={numero:'',data:hoje(),fornecedor:'',cnpj:'',total:0,itens:[],dups:[],lancarFin:true,origem:'Digitada',...o};
  n.itens=(n.itens||[]).map(it=>{const o=Object.assign({fator:1},it,{insumo:it.insumo||acharInsumo(n.cnpj,it.codigo,it.desc)});const ins=achar('insumos',o.insumo);if(ins&&num(ins.emb)>1&&(!it.fator||it.fator===1))o.fator=num(ins.emb);return o;});
  if(!n.itens.length)n.itens=[{desc:'',un:'peça',qtd:1,custo:0,fator:1,insumo:'__novo'}];
  return n;
}
function lerXmlNota(txt){
  const x=new DOMParser().parseFromString(txt,'text/xml');
  if(x.getElementsByTagName('parsererror').length)throw new Error('o arquivo não é um XML válido');
  const g=(el,t)=>{const e=el&&el.getElementsByTagName(t)[0];return e?e.textContent.trim():'';};
  const ide=x.getElementsByTagName('ide')[0],emit=x.getElementsByTagName('emit')[0];
  if(!ide||!emit)throw new Error('não parece ser o XML de uma nota fiscal eletrônica (NF-e)');
  const itens=[...x.getElementsByTagName('det')].map(d=>{
    const p=d.getElementsByTagName('prod')[0];
    const custo=num(g(p,'vProd'))+num(g(p,'vFrete'))+num(g(p,'vSeg'))+num(g(p,'vOutro'))-num(g(p,'vDesc'))+num(g(d,'vIPI'))+num(g(d,'vICMSST'));
    return {codigo:g(p,'cProd'),desc:g(p,'xProd'),un:unidade(g(p,'uCom')),unNota:g(p,'uCom'),qtd:num(g(p,'qCom')),custo:Math.round(custo*100)/100};
  });
  const inf=x.getElementsByTagName('infNFe')[0],chave=inf?soNum(inf.getAttribute('Id')):'';
  const dups=[...x.getElementsByTagName('dup')].map(d=>({venc:g(d,'dVenc'),valor:num(g(d,'vDup'))}));
  return novaNota({numero:g(ide,'nNF'),data:(g(ide,'dhEmi')||g(ide,'dEmi')).slice(0,10)||hoje(),fornecedor:g(emit,'xNome'),cnpj:g(emit,'CNPJ')||g(emit,'CPF'),
    total:num(g(x.getElementsByTagName('ICMSTot')[0],'vNF')),itens,dups,origem:'XML',chave:chave.length===44?chave:''});
}

// código de barras / QR code da nota: traz a chave de acesso (44 números)
async function lerChaveImagem(f){
  try{if(!('BarcodeDetector' in window))return '';
    const bd=new BarcodeDetector({formats:['code_128','qr_code','itf']});const r=await bd.detect(await createImageBitmap(f));
    for(const c of r){const m=String(c.rawValue||'').replace(/\s/g,'').match(/\d{44}/);if(m)return m[0];}}catch(e){}
  return '';
}
function aplicarChave(n,ch){
  n.chave=ch;if(!n.cnpj)n.cnpj=ch.slice(6,20);if(!n.numero)n.numero=String(+ch.slice(25,34));
}

    <label class="campo chk" style="margin-top:8px"><input type="checkbox" data-k="lancarFin" ${n.lancarFin?'checked':''} ${ro}><span>Lançar no Financeiro como conta a pagar (se não tiver parcelas, lança o total com vencimento hoje)</span></label></div>
  <div class="acoes" style="margin-bottom:24px">${n.id?`<button class="btn perigo" onclick="excluirNota()">Excluir</button>`:''}${ro?'':`<button class="btn sec" onclick="salvarNota()">Salvar sem dar entrada</button><button class="btn" onclick="darEntrada()">Dar entrada no estoque</button>`}</div>`;
}
function lerNota(){
  const n=estado.nota,t=document.getElementById('tela');if(!n||n.lancada||!t)return;
  t.querySelectorAll('[data-k]').forEach(el=>{const k=el.dataset.k;n[k]=el.type==='checkbox'?el.checked:el.type==='number'?num(el.value):el.value.trim();});
  const linhas=(id,cs,nums)=>[...t.querySelectorAll(`#${id} tbody tr`)].map(tr=>{const o={};cs.forEach(c=>{const el=tr.querySelector(`[data-c="${c}"]`);o[c]=nums.includes(c)?num(el.value):el.value;});return o;});
  if(t.querySelector('#n_itens'))n.itens=linhas('n_itens',['desc','qtd','un','custo','insumo','fator'],['qtd','custo','fator']).map((o,i)=>Object.assign({},n.itens[i]||{},o));
  if(t.querySelector('#n_dups'))n.dups=linhas('n_dups',['venc','valor'],['valor']);
}
document.getElementById('tela').addEventListener('change',e=>{if(estado.nota&&e.target.closest('#n_itens'))atualizarNota();});
document.getElementById('tela').addEventListener('input',e=>{if(estado.nota&&e.target.closest('#n_itens')&&e.target.type==='number'){lerNota();const tr=e.target.closest('tr'),it=estado.nota.itens[[...tr.parentNode.children].indexOf(tr)];const qe=num(it.qtd)*(num(it.fator)||1);tr.children[6].firstChild.textContent=qe?fmt(num(it.custo)/qe):'—';}});
function atualizarNota(){lerNota();const y=window.scrollY;render();window.scrollTo(0,y);}
function porItemNota(){lerNota();estado.nota.itens.push({desc:'',un:'peça',qtd:1,custo:0,fator:1,insumo:'__novo'});atualizarNota();}
function tirarItemNota(i){lerNota();estado.nota.itens.splice(i,1);atualizarNota();}
function porDupNota(){lerNota();estado.nota.dups.push({venc:hoje(),valor:0});atualizarNota();}
function tirarDupNota(i){lerNota();estado.nota.dups.splice(i,1);atualizarNota();}
function abrirNota(id){const n=achar('notas',id);if(!n)return;estado.nota=JSON.parse(JSON.stringify(n));render();window.scrollTo(0,0);}
function sairNota(){estado.nota=null;render();}
function salvarNota(){lerNota();const n=gravar('notas',estado.nota);estado.nota=JSON.parse(JSON.stringify(n));render();toast('Nota salva. Falta dar entrada no estoque.');}
async function excluirNota(){
  const n=estado.nota;
  if(!(await perguntar(n.lancada?'Excluir esta nota? O estoque e o financeiro NÃO voltam atrás: ajuste à mão se precisar.':'Excluir esta nota?')))return;
  if(n.id)excluir('notas',n.id);estado.nota=null;render();toast('Excluída');
}
async function darEntrada(){
  lerNota();const n=estado.nota;
  const itens=(n.itens||[]).filter(i=>i.desc&&num(i.qtd));
  if(!itens.length){aviso('A nota não tem itens com descrição e quantidade.');return;}
  const novos=itens.filter(i=>!achar('insumos',i.insumo)).length;
  if(!(await perguntar(`Dar entrada de ${itens.length} item(ns) no estoque${novos?` (${novos} material(is) novo(s) será(ão) criado(s))`:''}, atualizar o custo de cada material${n.lancarFin?' e lançar a conta a pagar':''}?`)))return;
  const motivo=`NF ${n.numero||'s/n'} — ${n.fornecedor||''}`.trim();
  let forn=ativos('fornecedores').find(f=>soNum(n.cnpj)&&soNum(f.doc)===soNum(n.cnpj))||ativos('fornecedores').find(f=>n.fornecedor&&(f.nome||'').toLowerCase()===n.fornecedor.toLowerCase());
  if(!forn&&n.fornecedor)forn=gravar('fornecedores',{nome:n.fornecedor,doc:n.cnpj,fornece:'Matéria-prima'});
  itens.forEach(it=>{
    const fator=num(it.fator)||1,qe=num(it.qtd)*fator,cu=qe?num(it.custo)/qe:0;
    let ins=achar('insumos',it.insumo);
    if(!ins)ins={nome:it.desc,unidade:it.un||'peça',qtd:0,minimo:0,custo:0,medida:MEDIDAS[0],fornecedor:forn?forn.id:''};
    else ins=JSON.parse(JSON.stringify(ins));
    ins.qtd=num(ins.qtd)+qe;if(cu)ins.custo=Math.round(cu*10000)/10000;
    if(fator>1&&num(it.qtd)){ins.emb=fator;ins.precoEmb=Math.round(num(it.custo)/num(it.qtd)*100)/100;}
    if(it.codigo&&soNum(n.cnpj)){const ch=soNum(n.cnpj)+':'+it.codigo;ins.codigos=[...new Set([...(ins.codigos||[]),ch])];}
    if(forn&&!ins.fornecedor)ins.fornecedor=forn.id;
    ins=gravar('insumos',ins);it.insumo=ins.id;
    gravar('movimentos',{insumo:ins.id,tipo:'Entrada',qtd:qe,data:n.data||hoje(),motivo});
  });
  if(n.lancarFin){
    const dups=(n.dups||[]).filter(d=>num(d.valor));
    const parc=dups.length?dups:[{venc:hoje(),valor:num(n.total)||itens.reduce((s,i)=>s+num(i.custo),0)}];
    parc.forEach((d,k)=>gravar('financeiro',{tipo:'A pagar',categoria:'Matéria-prima',descricao:`${motivo}${parc.length>1?` (parcela ${k+1}/${parc.length})`:''}`,valor:num(d.valor),venc:d.venc||hoje(),forma:'Boleto'}));
  }
  n.lancada=true;n.dataLanc=hoje();const s=gravar('notas',n);estado.nota=JSON.parse(JSON.stringify(s));
  render();window.scrollTo(0,0);toast('Entrada feita: estoque e custos atualizados');
}

/* ================== IMPRESSÃO ================== */
function cabecalho(titulo,numero,data){const c=db.config;return `<div class="cab"><div><h1>${esc(c.empresa)}</h1><div>${esc(c.cnpj?'CNPJ '+c.cnpj:'')}</div><div>${esc(c.endereco||'')}</div><div>${esc([c.tel,c.email].filter(Boolean).join(' · '))}</div></div><div style="text-align:right"><h1>${titulo} Nº ${esc(numero)}</h1><div>Data: ${fdata(data)}</div></div></div>`;}
function tabelaItens(r){return `<table><thead><tr><th>Item</th><th>Descrição</th><th>Qtd</th><th>Preço unit.</th><th>Total</th></tr></thead><tbody>${(r.itens||[]).map((it,i)=>`<tr><td>${i+1}</td><td>${esc(it.desc||nomeRef('produtos',it.prod))}</td><td>${fnum(it.qtd)}</td><td>${fmt(it.preco)}</td><td>${fmt(num(it.qtd)*num(it.preco))}</td></tr>`).join('')}</tbody></table>
  <table style="width:auto;margin-left:auto"><tr><td>Subtotal</td><td>${fmt(totalItens(r.itens))}</td></tr>${num(r.frete)?`<tr><td>Frete</td><td>${fmt(r.frete)}</td></tr>`:''}${num(r.desconto)?`<tr><td>Desconto</td><td>− ${fmt(r.desconto)}</td></tr>`:''}<tr><td><b>TOTAL</b></td><td><b>${fmt(totalDoc(r))}</b></td></tr></table>`;}
function blocoCliente(id){const cl=achar('clientes',id)||{};return `<p><b>Cliente:</b> ${esc(cl.nome)}${cl.doc?' · '+esc(cl.doc):''}<br>${esc([cl.tel,cl.email].filter(Boolean).join(' · '))}<br>${esc([cl.endereco,cl.cidade].filter(Boolean).join(' — '))}</p>`;}
function docOrcamento(r){return `${cabecalho('ORÇAMENTO',r.numero,r.data)}${blocoCliente(r.cliente)}${r.obra?`<p><b>Local da obra:</b> ${esc(r.obra)}</p>`:''}${tabelaItens(r)}
  <p><b>Prazo de entrega:</b> ${esc(r.prazo||'')}<br><b>Pagamento:</b> ${esc(r.pagamento||'')}<br><b>Validade desta proposta:</b> ${fdata(r.validade)}</p>${r.obs?`<p><b>Observações:</b><br>${esc(r.obs).replace(/\n/g,'<br>')}</p>`:''}
  <div class="ass"><div>${esc(db.config.empresa)}</div><div>De acordo — cliente</div></div>`;}
function docOP(p){
  const mat=consumoPedido(p);
  const ids=Object.keys(mat);
  return `${cabecalho('ORDEM DE PRODUÇÃO',p.numero,p.data)}${blocoCliente(p.cliente)}<p><b>ENTREGA:</b> ${fdata(p.entrega)} ${p.montagem?' · <b>COM MONTAGEM NA OBRA</b>':''}</p>
  <table><thead><tr><th>Item</th><th>Descrição</th><th>Qtd</th>${['Corte','Furação','Dobra','Acabam.','Conferido'].map(e=>`<th>${e}</th>`).join('')}</tr></thead><tbody>${(p.itens||[]).map((it,i)=>`<tr><td>${i+1}</td><td>${esc(it.desc||nomeRef('produtos',it.prod))}</td><td>${fnum(it.qtd)}</td><td></td><td></td><td></td><td></td><td></td></tr>`).join('')}</tbody></table>
  ${ids.length?`<p><b>Materiais necessários (pela ficha técnica):</b></p><table><thead><tr><th>Material</th><th>Quantidade</th><th>Em estoque</th></tr></thead><tbody>${ids.map(id=>{const i=achar('insumos',id);return `<tr><td>${esc(i.nome)}</td><td>${fnum(mat[id])} ${esc(i.unidade||'')}</td><td>${fnum(i.qtd)}</td></tr>`;}).join('')}</tbody></table>`:''}
  ${p.obs?`<p><b>Observações:</b><br>${esc(p.obs).replace(/\n/g,'<br>')}</p>`:''}<p>Refugo / perdas: ______________________</p>
  <div class="ass"><div>Responsável pela produção</div><div>Conferência final</div></div>`;
}
const CSS_DOC='body{font:12px/1.4 Arial,sans-serif;color:#000;max-width:800px;margin:20px auto}table{width:100%;border-collapse:collapse;margin:10px 0}th,td{border:1px solid #999;padding:5px 7px}h1{font-size:18px;margin:0}.cab{display:flex;justify-content:space-between;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:10px}.ass{display:flex;gap:40px;margin-top:50px}.ass div{flex:1;border-top:1px solid #000;text-align:center;padding-top:4px}';
function imprimir(html,nome){
  if(nuvem){
    const t=x=>'<'+x+'>';
    const doc=t('!doctype html')+t('html lang="pt-BR"')+t('head')+t('meta charset="utf-8"')+`<title>${esc(nome)}</title><style>${CSS_DOC}</style>`+t('/head')+t('body')+html+'<script>window.onload=()=>window.print()<\/script>'+t('/body')+t('/html');
    baixar(nome+'.html',doc,'text/html');toast('Abra o arquivo baixado para imprimir ou salvar em PDF');return;
  }
  const el=document.getElementById('impressao');el.innerHTML=html;setTimeout(()=>{window.print();},50);
}

/* ================== EXPORTAR / BACKUP ================== */
async function baixar(nome,conteudo,tipo){
  if(nuvem){try{const dl=await window.claude.use('downloads');if(dl){await dl.save({filename:nome,data:new Blob([conteudo],{type:tipo})});return;}}catch(e){if(e&&e.code&&e.code!=='unavailable')return;}
    aviso('Não foi possível baixar o arquivo neste aparelho.');return;}
  const b=new Blob([conteudo],{type:tipo});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=nome;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
function exportarCSV(c){
  const m=MOD[c],rows=filtrar(c);
  const cel=v=>'"'+String(v??'').replace(/<[^>]+>/g,'').replace(/"/g,'""')+'"';
  const linhas=[m.cols.map(col=>cel(col[1])).join(';'),...rows.map(r=>m.cols.map(col=>cel(col[2]?col[2](r):r[col[0]])).join(';'))];
  baixar(`${c}-${hoje()}.csv`,'﻿'+linhas.join('\r\n'),'text/csv;charset=utf-8');
}
function exportarBackup(){baixar(`backup-custo-certo-${hoje()}.json`,JSON.stringify(db),'application/json');}
document.getElementById('arqImport').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  try{const d=JSON.parse(await f.text());mesclar(d);salvar();enviarTudo();render();toast('Backup importado');}catch(err){aviso('Arquivo inválido: '+err.message);}
  e.target.value='';
});

/* ================== ARQUIVO COMPARTILHADO ================== */
let arqHandle=null,timerArq=null,sincronizando=false,handlePend=null;
function mesclar(rem){
  COLS.forEach(c=>{
    const mapa=new Map(db[c].map(r=>[r.id,r]));
    (rem[c]||[]).forEach(r=>{const l=mapa.get(r.id);if(!l||num(r.alterado)>num(l.alterado))mapa.set(r.id,r);});
    db[c]=[...mapa.values()].sort((a,b)=>num(a.criado)-num(b.criado)||String(a.id).localeCompare(String(b.id)));
  });
  if(rem.config&&num(rem.config.alterado)>num(db.config.alterado))db.config=rem.config;
}
function idb(){return new Promise((ok,err)=>{const q=indexedDB.open('custocerto_arq',1);q.onupgradeneeded=()=>q.result.createObjectStore('h');q.onsuccess=()=>ok(q.result);q.onerror=()=>err(q.error);});}
async function idbSet(v){const d=await idb();return new Promise(ok=>{const t=d.transaction('h','readwrite');if(v)t.objectStore('h').put(v,'arq');else t.objectStore('h').delete('arq');t.oncomplete=ok;t.onerror=ok;});}
async function idbGet(){const d=await idb();return new Promise(ok=>{const q=d.transaction('h').objectStore('h').get('arq');q.onsuccess=()=>ok(q.result||null);q.onerror=()=>ok(null);});}
const TIPOS=[{description:'Dados da gestão',accept:{'application/json':['.json']}}];
async function criarArquivo(){
  try{const h=await showSaveFilePicker({suggestedName:'dados-custo-certo.json',types:TIPOS});arqHandle=h;await idbSet(h);await sincronizar(true);toast('Arquivo compartilhado criado');}
  catch(e){if(e.name!=='AbortError')aviso('Não foi possível criar: '+e.message);}
}
async function abrirArquivo(){
  try{const [h]=await showOpenFilePicker({types:TIPOS});const p=await h.requestPermission({mode:'readwrite'});if(p!=='granted'){aviso('Sem permissão para gravar no arquivo.');return;}
    arqHandle=h;await idbSet(h);await sincronizar(true);toast('Conectado ao arquivo compartilhado');}
  catch(e){if(e.name!=='AbortError')aviso('Não foi possível abrir: '+e.message);}
}
async function desconectar(){if(!(await perguntar('Desconectar do arquivo compartilhado? Os dados continuam neste computador.')))return;arqHandle=null;handlePend=null;await idbSet(null);estado.sync={modo:'local'};render();}
async function reconectar(){
  if(!handlePend)return;
  try{if(await handlePend.requestPermission({mode:'readwrite'})==='granted'){arqHandle=handlePend;handlePend=null;await sincronizar(true);toast('Conectado');}}catch(e){aviso(e.message);}
}
async function sincronizar(forcarTela){
  if(!arqHandle||sincronizando)return;sincronizando=true;let mudou=false;
  try{
    const antes=JSON.stringify(db);
    const txt=await (await arqHandle.getFile()).text();
    if(txt.trim()){const rem=JSON.parse(txt);mesclar(rem);}
    const agora=JSON.stringify(db);mudou=agora!==antes;
    try{localStorage.setItem(LS,agora);}catch(e){}
    if(agora!==txt){const w=await arqHandle.createWritable();await w.write(agora);await w.close();}
    estado.sync={modo:'ok',hora:horaAgora(),nome:arqHandle.name};
  }catch(e){estado.sync={modo:'erro',msg:e.message};}
  sincronizando=false;
  if((mudou||forcarTela)&&!estado.edit&&!(document.activeElement&&document.activeElement.type==='search'))render();else topo();
}
function agendarArquivo(){if(!arqHandle)return;clearTimeout(timerArq);timerArq=setTimeout(()=>sincronizar(),700);}
async function iniciarArquivo(){
  if(!('showSaveFilePicker' in window))return;
  try{const h=await idbGet();if(!h)return;
    if(await h.queryPermission({mode:'readwrite'})==='granted'){arqHandle=h;await sincronizar(true);}
    else{handlePend=h;estado.sync={modo:'pendente'};topo();}
  }catch(e){}
}
setInterval(()=>{if(arqHandle&&!document.hidden)sincronizar();},45000);
window.addEventListener('focus',()=>{if(arqHandle)sincronizar();});

/* ================== UTIL ================== */
let timerToast;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(timerToast);timerToast=setTimeout(()=>t.classList.add('hidden'),2600);}

carregarLocal();render();
iniciarNuvem().then(ok=>{if(!ok)iniciarArquivo();else prepararFoto();prepararVoz();});
