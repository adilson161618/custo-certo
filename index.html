<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Custo Certo</title>
<meta name="description" content="Calcule quanto custa fazer qualquer coisa: receitas, peças, pedaços de material. E qual preço cobrar.">
<meta name="theme-color" content="#16A34A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="custocerto-icon-192.png">
<link rel="apple-touch-icon" href="custocerto-icon-192.png">
<style>
:root{
  --bg:#f4f6f5;--card:#ffffff;--ink:#16211b;--quiet:#66736b;--line:#e2e8e4;
  --acc:#16A34A;--acc2:#15803D;--accsoft:#e8f7ee;--bad:#c62828;--badsoft:#fdecec;
  --sombra:0 1px 2px rgba(0,0,0,.06),0 2px 10px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1512;--card:#18211c;--ink:#e8efe9;--quiet:#98a69d;--line:#27332c;
  --acc:#22c55e;--acc2:#16a34a;--accsoft:#14301f;--bad:#ef5350;--badsoft:#3a1b1b;--sombra:none;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--acc2);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px;min-height:56px}
header h1{font-size:19px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .vb{background:none;border:0;color:#fff;font-size:24px;padding:4px 8px 4px 0;cursor:pointer;line-height:1}
header .salvo{font-size:12px;opacity:.85}
main{max-width:640px;margin:0 auto;padding:14px 14px calc(96px + env(safe-area-inset-bottom))}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;padding:9px 4px 8px;color:var(--quiet);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button .ic{font-size:21px;line-height:1}
nav button.on{color:var(--acc2);font-weight:700}
@media (prefers-color-scheme:dark){nav button.on{color:var(--acc)}}
.card{background:var(--card);border-radius:14px;box-shadow:var(--sombra);border:1px solid var(--line);padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px;color:var(--quiet);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.btn{background:var(--acc2);color:#fff;border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px}
.btn.sec{background:var(--accsoft);color:var(--acc2)}
@media (prefers-color-scheme:dark){.btn.sec{color:var(--acc)}}
.btn.perigo{background:var(--badsoft);color:var(--bad)}
.btn.cheio{width:100%}
.btn.ouvindo{background:var(--bad);color:#fff}
.linha-btn{display:flex;gap:8px;flex-wrap:wrap}
.linha-btn .btn{flex:1}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 11px;min-height:44px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--acc)}
label.campo{display:block;margin-bottom:10px}
label.campo span{display:block;font-size:13px;color:var(--quiet);margin-bottom:4px}
.dois{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lista-item{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.lista-item:last-child{border-bottom:0}
.lista-item .t{flex:1;min-width:0}
.lista-item .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lista-item .t small{color:var(--quiet)}
.lista-item .v{text-align:right;white-space:nowrap}
.lista-item .v small{display:block;color:var(--quiet);font-size:12px}
.vazio{text-align:center;color:var(--quiet);padding:18px 8px}
.item{border-bottom:1px solid var(--line);padding:10px 0}
.item:last-child{border-bottom:0}
.item .topo{display:flex;gap:8px;align-items:center}
.item .topo input{flex:1}
.item .qtd{display:grid;grid-template-columns:1fr 1.2fr auto;gap:8px;margin-top:8px;align-items:center}
.item .custo{font-weight:700;min-width:84px;text-align:right}
.item .info{font-size:12.5px;color:var(--quiet);margin-top:5px}
.item .info.erro{color:var(--bad)}
.x{background:none;border:0;color:var(--quiet);font-size:20px;padding:6px 8px;cursor:pointer}
.res{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:baseline}
.res .grande{font-size:26px;font-weight:800;color:var(--acc2)}
@media (prefers-color-scheme:dark){.res .grande{color:var(--acc)}}
.res .sep{grid-column:1/-1;border-top:1px solid var(--line);margin:6px 0}
.nota{font-size:13px;color:var(--quiet)}
.fala{font-size:13.5px;color:var(--quiet);margin-top:8px;min-height:1em}
dialog{border:0;border-radius:18px;padding:0;width:min(520px,calc(100vw - 24px));background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form{padding:18px}
dialog h3{margin:0 0 12px;font-size:18px}
.calc-mini{background:var(--accsoft);border-radius:10px;padding:10px 12px;font-size:14px;margin:4px 0 12px}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:22px;font-size:14px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1}
a{color:var(--acc2)}
.exemplos{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
</style>
</head>
<body>
<header id="cab"></header>
<main id="tela"></main>
<nav id="menu"></nav>
<div id="toast"></div>
<datalist id="dl_mat"></datalist>

<dialog id="dlgMat"><form method="dialog" id="fMat">
  <h3 id="mTit">Material</h3>
  <label class="campo"><span>Nome</span><input id="mNome" required placeholder="Ex.: Farinha de trigo, Barra chata 1/2"></label>
  <label class="campo"><span>Quanto você pagou (R$)</span><input id="mPreco" inputmode="decimal" placeholder="Ex.: 8,50" required></label>
  <div class="dois">
    <label class="campo"><span>Quanto veio</span><input id="mQtd" inputmode="decimal" placeholder="Ex.: 1 ou 1x2" required></label>
    <label class="campo"><span>Unidade</span><select id="mUn"></select></label>
  </div>
  <div class="calc-mini" id="mCalc">Preencha o preço e quanto veio.</div>
  <div class="linha-btn"><button type="button" class="btn perigo" id="mExcluir">Excluir</button><button type="button" class="btn sec" value="cancel" onclick="dlgMat.close()">Cancelar</button><button class="btn" id="mSalvar">Salvar</button></div>
</form></dialog>

<script>
/* ================= DADOS ================= */
const LS='custocerto_v2';
let db={materiais:[],calculos:[],ajustes:{hora:20,margem:30,taxas:0,nome:'',empresa:''}};
try{const s=JSON.parse(localStorage.getItem(LS));if(s&&s.materiais){db=s;db.ajustes=Object.assign({hora:20,margem:30,taxas:0,nome:'',empresa:''},db.ajustes||{});}}catch(e){}
let timerSalvar;
function salvar(){clearTimeout(timerSalvar);timerSalvar=setTimeout(()=>{try{localStorage.setItem(LS,JSON.stringify(db));const s=document.getElementById('salvo');if(s){s.textContent='Salvo';}}catch(e){toast('Não foi possível salvar neste aparelho');}},300);const s=document.getElementById('salvo');if(s)s.textContent='Salvando...';}
const novoId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const mat=id=>db.materiais.find(m=>m.id===id);

/* ================= UNIDADES ================= */
const UN={
  g:{d:'massa',f:1,n:'g'},kg:{d:'massa',f:1000,n:'kg'},
  ml:{d:'vol',f:1,n:'ml'},L:{d:'vol',f:1000,n:'litro'},xic:{d:'vol',f:240,n:'xícara'},cs:{d:'vol',f:15,n:'colher de sopa'},cc:{d:'vol',f:5,n:'colher de chá'},
  mm:{d:'comp',f:0.1,n:'mm'},cm:{d:'comp',f:1,n:'cm'},m:{d:'comp',f:100,n:'metro'},
  cm2:{d:'area',f:1,n:'cm² (ex.: 10x20)'},m2:{d:'area',f:10000,n:'m² (ex.: 1x2)'},
  un:{d:'un',f:1,n:'unidade'},dz:{d:'un',f:12,n:'dúzia'},ct:{d:'un',f:100,n:'cento'}
};
const UN_CURTO={g:'g',kg:'kg',ml:'ml',L:'L',xic:'xíc.',cs:'c. sopa',cc:'c. chá',mm:'mm',cm:'cm',m:'m',cm2:'cm²',m2:'m²',un:'un',dz:'dúzia',ct:'cento'};
const USO_PADRAO={kg:'g',g:'g',L:'ml',ml:'ml',m:'cm',cm:'cm',mm:'mm',m2:'cm2',cm2:'cm2',un:'un',dz:'un',ct:'un',xic:'xic',cs:'cs',cc:'cc'};
const BASE={massa:'kg',vol:'L',comp:'m',area:'m2',un:'un'};
function opcoesUn(sel,dim){return Object.keys(UN).filter(k=>!dim||UN[k].d===dim).map(k=>`<option value="${k}" ${k===sel?'selected':''}>${UN[k].n}</option>`).join('');}
// "1,5" "10x20" "1/2" "2 x 0,5"
function lerQtd(s){
  s=String(s==null?'':s).trim().toLowerCase().replace(/(\d)\.(\d{3})(?!\d)/g,'$1$2').replace(/,/g,'.');
  if(!s)return 0;
  const partes=s.split(/\s*[x×*]\s*/).map(p=>{const f=p.match(/^(\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)$/);if(f)return +f[1]/+f[2];const n=parseFloat(p);return isNaN(n)?NaN:n;});
  if(partes.some(isNaN))return 0;
  return partes.reduce((a,b)=>a*b,1);
}
const dinheiro=v=>(isFinite(v)?v:0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
function dinheiroFino(v){if(!isFinite(v))v=0;return Math.abs(v)<0.1&&v!==0?'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:4}):dinheiro(v);}
const numero=v=>(isFinite(v)?v:0).toLocaleString('pt-BR',{maximumFractionDigits:3});
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// preço de 1 unidade base (kg, L, m, m², un) do material
function precoBase(m){const q=lerQtd(m.qtd)*UN[m.un].f/UN[BASE[UN[m.un].d]].f;return q?Number(m.preco)/q:0;}
function textoPrecoMat(m){const d=UN[m.un].d,b=BASE[d];const p=precoBase(m);
  let s=`${dinheiroFino(p)} por ${UN_CURTO[b]}`;
  if(d==='massa'||d==='vol')s+=` · ${dinheiroFino(p/1000)} por ${d==='massa'?'g':'ml'}`;
  if(d==='comp')s+=` · ${dinheiroFino(p/100)} por cm`;
  if(d==='area')s+=` · ${dinheiroFino(p/10000)} por cm²`;
  return s;}

/* ================= CONTA ================= */
function custoItem(it){
  const m=mat(it.mat);
  if(!m)return {custo:0,erro:it.nome?'Material sem preço: toque em "Cadastrar preço"':'',semMat:!!it.nome};
  const u=UN[it.un]||UN[USO_PADRAO[m.un]];
  if(u.d!==UN[m.un].d)return {custo:0,erro:`Unidade não combina: ${m.nome} foi comprado em ${UN[m.un].n}`};
  const q=lerQtd(it.qtd)*u.f/UN[BASE[u.d]].f;
  return {custo:q*precoBase(m),info:`${textoPrecoMat(m).split(' · ')[0]}`};
}
function resumo(c){
  const a=db.ajustes;let mats=0;(c.itens||[]).forEach(it=>mats+=custoItem(it).custo);
  const mo=lerQtd(c.minutos)/60*Number(a.hora||0);
  const outros=(c.outros||[]).reduce((s,o)=>s+lerQtd(o.valor),0);
  const total=mats+mo+outros,rende=Math.max(lerQtd(c.rende)||1,0.0001),un=total/rende;
  const margem=c.margem===''||c.margem==null?Number(a.margem||0):lerQtd(c.margem),taxas=Number(a.taxas||0);
  const div=1-(margem+taxas)/100,preco=div>0.01?un/div:0,lucro=preco*(1-taxas/100)-un;
  return {mats,mo,outros,total,rende,un,margem,taxas,preco,lucro,erroMargem:div<=0.01};
}

/* ================= NAVEGAÇÃO ================= */
let calcAtual=null;
function rota(){const h=location.hash.replace('#','');const [t,id]=h.split('/');return {t:t||'calculos',id};}
function ir(h){if(location.hash==='#'+h)render();else location.hash=h;}
window.addEventListener('hashchange',()=>{pararFala();render();});
function render(){
  const r=rota();calcAtual=null;
  const cab=document.getElementById('cab'),tela=document.getElementById('tela');
  document.getElementById('menu').innerHTML=[['calculos','🧮','Cálculos'],['materiais','📦','Materiais'],['ajustes','⚙️','Ajustes']].map(([k,ic,l])=>`<button class="${r.t===k||(r.t==='calc'&&k==='calculos')?'on':''}" onclick="ir('${k}')"><span class="ic">${ic}</span>${l}</button>`).join('');
  if(r.t==='calc'){const c=db.calculos.find(x=>x.id===r.id);if(!c){ir('calculos');return;}calcAtual=c;
    cab.innerHTML=`<button class="vb" onclick="ir('calculos')" aria-label="Voltar">‹</button><h1>${esc(c.nome||'Novo cálculo')}</h1><span class="salvo" id="salvo"></span>`;tela.innerHTML=telaCalc(c);atualizarCalc();return;}
  const tit={calculos:'Custo Certo',materiais:'Materiais',ajustes:'Ajustes'}[r.t]||'Custo Certo';
  cab.innerHTML=`<h1>${tit}</h1><span class="salvo" id="salvo"></span>`;
  tela.innerHTML=r.t==='materiais'?telaMateriais():r.t==='ajustes'?telaAjustes():telaCalculos();
}

/* ================= CÁLCULOS (lista) ================= */
function telaCalculos(){
  const cs=[...db.calculos].sort((a,b)=>(b.atualizado||0)-(a.atualizado||0));
  return `<button class="btn cheio" onclick="novoCalculo()" style="margin-bottom:12px">+ Novo cálculo</button>
  <div class="card">${cs.length?cs.map(c=>{const r=resumo(c);return `<div class="lista-item" onclick="ir('calc/${c.id}')"><div class="t"><b>${esc(c.nome||'Sem nome')}</b><small>${(c.itens||[]).length} item(ns)${r.rende!==1?` · rende ${numero(r.rende)}`:''}</small></div><div class="v"><b>${dinheiro(r.preco)}</b><small>custo ${dinheiro(r.un)}</small></div></div>`;}).join('')
  :`<div class="vazio"><b>Quanto custa fazer?</b><br>Monte um bolo, uma peça, um pedaço de barra... e veja o custo e o preço de venda.<div class="exemplos"><button class="btn sec" onclick="exemplo('bolo')">Ver exemplo: bolo</button><button class="btn sec" onclick="exemplo('barra')">Ver exemplo: barra</button></div></div>`}</div>
  ${cs.length?'<p class="nota" style="text-align:center">O preço muda sozinho quando você atualiza o preço de um material.</p>':''}`;
}
function novoCalculo(nome){const c={id:novoId(),nome:nome||'',itens:[],minutos:'',outros:[],rende:1,margem:'',atualizado:Date.now()};db.calculos.push(c);salvar();ir('calc/'+c.id);setTimeout(()=>{const n=document.getElementById('cNome');if(n&&!nome)n.focus();},50);}

/* ================= CÁLCULO (editor) ================= */
function telaCalc(c){
  return `<div class="card"><label class="campo" style="margin:0"><span>O que você vai fazer?</span><input id="cNome" value="${esc(c.nome)}" placeholder="Ex.: Bolo de chocolate, Pedaço de barra 1,5 m"></label></div>
  <div class="card"><h2>Materiais usados</h2>
    <div id="itens">${(c.itens||[]).map((it,i)=>itemHTML(it,i)).join('')||'<p class="nota" style="margin:0 0 6px">Adicione o que vai usar: digite ou fale.</p>'}</div>
    <div style="display:flex;gap:8px;margin-top:10px"><input id="novoItem" list="dl_mat" placeholder="Digite um material e toque em +" enterkeyhint="done"><button class="btn" onclick="addItem()" aria-label="Adicionar">+</button>${SR?`<button class="btn sec" id="btnMic" onclick="falar()" aria-label="Falar">🎤</button>`:''}</div>
    <div class="fala" id="fala">${SR?'Toque em 🎤 e fale: "200 gramas de farinha, 3 ovos".':''}</div>
  </div>
  <div class="card"><h2>Trabalho e outros gastos</h2>
    <div class="dois"><label class="campo"><span>Tempo de trabalho (minutos)</span><input data-c="minutos" inputmode="decimal" value="${esc(c.minutos)}" placeholder="0"></label>
    <label class="campo"><span>Valor da sua hora</span><input value="${esc(dinheiro(db.ajustes.hora))}" disabled title="Mude em Ajustes"></label></div>
    <div id="outros">${(c.outros||[]).map((o,i)=>`<div style="display:flex;gap:8px;margin-bottom:8px"><input data-o="nome" data-i="${i}" value="${esc(o.nome)}" placeholder="Ex.: gás, embalagem, frete"><input data-o="valor" data-i="${i}" value="${esc(o.valor)}" inputmode="decimal" placeholder="R$" style="max-width:110px"><button class="x" onclick="tirarOutro(${i})" aria-label="Remover">✕</button></div>`).join('')}</div>
    <button class="btn sec" onclick="addOutro()">+ Outro gasto (gás, embalagem, frete)</button>
  </div>
  <div class="card"><h2>Resultado</h2>
    <div class="dois"><label class="campo"><span>Rende quantas unidades?</span><input data-c="rende" inputmode="decimal" value="${esc(c.rende)}" placeholder="1"></label>
    <label class="campo"><span>Margem de lucro (%)</span><input data-c="margem" inputmode="decimal" value="${esc(c.margem)}" placeholder="${esc(db.ajustes.margem)}"></label></div>
    <div class="res" id="res"></div>
  </div>
  <div class="linha-btn" style="margin-bottom:10px"><button class="btn sec" onclick="compartilhar()">Compartilhar</button><button class="btn sec" onclick="ouvir()">🔊 Ouvir</button></div>
  <div class="linha-btn"><button class="btn sec" onclick="duplicar()">Duplicar</button><button class="btn perigo" onclick="excluirCalc()">Excluir</button></div>`;
}
function itemHTML(it,i){
  const m=mat(it.mat),dim=m?UN[m.un].d:null;
  return `<div class="item" data-i="${i}"><div class="topo"><input data-k="nome" list="dl_mat" value="${esc(m?m.nome:it.nome)}" aria-label="Material"><button class="x" onclick="tirarItem(${i})" aria-label="Remover">✕</button></div>
  <div class="qtd"><input data-k="qtd" inputmode="decimal" value="${esc(it.qtd)}" placeholder="Quanto usa"><select data-k="un">${opcoesUn(it.un,dim)}</select><span class="custo">—</span></div>
  <div class="info"></div>${!m&&it.nome?`<button class="btn sec" style="margin-top:8px;min-height:38px;padding:8px 12px" onclick="cadastrarDoItem(${i})">Cadastrar preço de "${esc(it.nome)}"</button>`:''}</div>`;
}
function atualizarCalc(){
  const c=calcAtual;if(!c)return;
  document.querySelectorAll('#itens .item').forEach(el=>{const it=c.itens[+el.dataset.i];if(!it)return;const x=custoItem(it);
    el.querySelector('.custo').textContent=x.erro?'—':dinheiro(x.custo);const inf=el.querySelector('.info');inf.textContent=x.erro||x.info||'';inf.classList.toggle('erro',!!x.erro);});
  const r=resumo(c),l=(t,v,cl)=>`<span class="${cl||''}">${t}</span><b class="${cl||''}">${v}</b>`;
  document.getElementById('res').innerHTML=
    l('Materiais',dinheiro(r.mats))+l('Trabalho',dinheiro(r.mo))+l('Outros gastos',dinheiro(r.outros))+
    `<div class="sep"></div>`+l('<b>Custo total</b>',dinheiro(r.total))+
    (r.rende!==1?l(`Custo de cada unidade (rende ${numero(r.rende)})`,dinheiro(r.un)):'')+
    `<div class="sep"></div><span>Preço de venda${r.rende!==1?' de cada unidade':''}</span><span class="grande">${r.erroMargem?'—':dinheiro(r.preco)}</span>`+
    l(`Lucro${r.rende!==1?' por unidade':''}`,r.erroMargem?'—':dinheiro(r.lucro))+
    (r.taxas?`<span class="nota" style="grid-column:1/-1">Já desconta ${numero(r.taxas)}% de taxas (cartão, impostos).</span>`:'')+
    (r.erroMargem?`<span class="nota" style="grid-column:1/-1;color:var(--bad)">Margem + taxas precisam ficar abaixo de 100%.</span>`:'');
}
function tocou(){if(calcAtual){calcAtual.atualizado=Date.now();salvar();}}
// resolve o material pelo nome digitado
function acharMat(nome){
  const n=semAc(nome).trim();if(!n)return null;
  return db.materiais.find(m=>semAc(m.nome)===n)||acharParecido(n);
}
function definirNome(it,nome){
  it.nome=nome.trim();const m=acharMat(it.nome);const antes=it.mat;
  it.mat=m?m.id:'';
  if(m){it.nome=m.nome;if(!it.un||!UN[it.un]||UN[it.un].d!==UN[m.un].d)it.un=USO_PADRAO[m.un];}
  return antes!==it.mat;
}
function addItem(texto){
  const inp=document.getElementById('novoItem');const v=(texto!=null?texto:inp.value).trim();if(!v)return;
  const it={nome:'',mat:'',qtd:'',un:''};definirNome(it,v);if(!it.un)it.un='un';
  calcAtual.itens.push(it);tocou();render();
  const ult=document.querySelector(`#itens .item[data-i="${calcAtual.itens.length-1}"] [data-k="qtd"]`);if(ult)ult.focus();
}
function tirarItem(i){calcAtual.itens.splice(i,1);tocou();render();}
function addOutro(){calcAtual.outros=calcAtual.outros||[];calcAtual.outros.push({nome:'',valor:''});tocou();render();const el=document.querySelector(`[data-o="nome"][data-i="${calcAtual.outros.length-1}"]`);if(el)el.focus();}
function tirarOutro(i){calcAtual.outros.splice(i,1);tocou();render();}
document.getElementById('tela').addEventListener('input',e=>{
  const t=e.target,c=calcAtual;if(!c)return;
  if(t.id==='cNome'){c.nome=t.value;document.querySelector('#cab h1').textContent=t.value||'Novo cálculo';tocou();return;}
  if(t.dataset.c){c[t.dataset.c]=t.value;tocou();atualizarCalc();return;}
  if(t.dataset.o){c.outros[+t.dataset.i][t.dataset.o]=t.value;tocou();atualizarCalc();return;}
  const el=t.closest('.item');if(el&&t.dataset.k&&t.dataset.k!=='nome'){c.itens[+el.dataset.i][t.dataset.k]=t.value;tocou();atualizarCalc();}
});
document.getElementById('tela').addEventListener('change',e=>{
  const t=e.target,el=t.closest&&t.closest('.item');
  if(calcAtual&&el&&t.dataset.k==='nome'){const it=calcAtual.itens[+el.dataset.i];definirNome(it,t.value);tocou();render();}

document.getElementById('tela').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='novoItem'){e.preventDefault();addItem();}});
function duplicar(){const c=JSON.parse(JSON.stringify(calcAtual));c.id=novoId();c.nome=(c.nome||'Cálculo')+' (cópia)';c.atualizado=Date.now();db.calculos.push(c);salvar();ir('calc/'+c.id);toast('Cópia criada');}
function excluirCalc(){if(!confirm(`Excluir "${calcAtual.nome||'este cálculo'}"?`))return;db.calculos=db.calculos.filter(x=>x!==calcAtual);salvar();ir('calculos');}
function textoResumo(c){
  const r=resumo(c),a=db.ajustes,linhas=[];
  linhas.push(`*${c.nome||'Cálculo'}*`);
  (c.itens||[]).forEach(it=>{const m=mat(it.mat),x=custoItem(it);linhas.push(`• ${m?m.nome:it.nome}: ${it.qtd||0} ${UN_CURTO[it.un]||''} = ${dinheiro(x.custo)}`);});
  if(r.mo)linhas.push(`• Trabalho (${numero(lerQtd(c.minutos))} min): ${dinheiro(r.mo)}`);
  (c.outros||[]).filter(o=>o.nome||lerQtd(o.valor)).forEach(o=>linhas.push(`• ${o.nome||'Outro'}: ${dinheiro(lerQtd(o.valor))}`));
  linhas.push(`Custo total: ${dinheiro(r.total)}`);
  if(r.rende!==1)linhas.push(`Rende ${numero(r.rende)} · custo de cada: ${dinheiro(r.un)}`);
  linhas.push(`Preço de venda${r.rende!==1?' (cada)':''}: ${dinheiro(r.preco)} · lucro ${dinheiro(r.lucro)}`);
  const quem=[a.empresa,a.nome].filter(Boolean).join(' · ');
  linhas.push(quem?`— ${quem} (calculado no Custo Certo)`:'— calculado no Custo Certo');
  return linhas.join('\n');
}
async function compartilhar(){
  const t=textoResumo(calcAtual);
  if(navigator.share){try{await navigator.share({title:calcAtual.nome||'Custo Certo',text:t});return;}catch(e){if(e.name==='AbortError')return;}}
  try{await navigator.clipboard.writeText(t);toast('Resumo copiado. Cole no WhatsApp.');}catch(e){window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank');}
}

  :`<div class="vazio">Cadastre o que você compra e quanto pagou.<br>Ex.: farinha 1 kg por R$ 6; barra de 6 m por R$ 120; caixa com 30 ovos por R$ 18.</div>`}</div>`;

let matEdit=null,matDepois=null;
const dlgMat=document.getElementById('dlgMat');
document.getElementById('mUn').innerHTML=opcoesUn('kg');
function abrirMat(id,nome,depois){
  const m=id?mat(id):null;matEdit=m;matDepois=depois||null;
  document.getElementById('mTit').textContent=m?'Editar material':'Novo material';
  document.getElementById('mNome').value=m?m.nome:(nome||'');
  document.getElementById('mPreco').value=m?String(m.preco).replace('.',','):'';
  document.getElementById('mQtd').value=m?m.qtd:'';
  document.getElementById('mUn').value=m?m.un:'kg';
  document.getElementById('mExcluir').style.display=m?'':'none';
  calcMat();dlgMat.showModal();
  setTimeout(()=>document.getElementById(m||nome?'mPreco':'mNome').focus(),50);
}
function calcMat(){
  const p=lerQtd(document.getElementById('mPreco').value),q=lerQtd(document.getElementById('mQtd').value),u=document.getElementById('mUn').value;
  const el=document.getElementById('mCalc');
  if(!p||!q){el.textContent=u==='m2'?'Chapa: em "Quanto veio" escreva o tamanho, ex.: 1x2 (metros).':'Preencha o preço e quanto veio.';return;}
  el.textContent='Sai a '+textoPrecoMat({preco:p,qtd:document.getElementById('mQtd').value,un:u});
}
['mPreco','mQtd','mUn'].forEach(id=>document.getElementById(id).addEventListener('input',calcMat));
document.getElementById('fMat').addEventListener('submit',e=>{
  if(e.submitter&&e.submitter.value==='cancel')return;
  const nome=document.getElementById('mNome').value.trim(),preco=lerQtd(document.getElementById('mPreco').value),qtd=document.getElementById('mQtd').value.trim(),un=document.getElementById('mUn').value;
  if(!nome||!preco||!lerQtd(qtd)){e.preventDefault();toast('Preencha nome, preço e quanto veio');return;}
  const m=matEdit||{id:novoId()};const novo=!matEdit;
  Object.assign(m,{nome,preco,qtd,un});if(novo)db.materiais.push(m);
  // cálculos que esperavam esse material
  db.calculos.forEach(c=>(c.itens||[]).forEach(it=>{if(!it.mat&&semAc(it.nome)===semAc(nome)){it.mat=m.id;it.un=USO_PADRAO[m.un];}
    if(it.mat===m.id&&UN[it.un]&&UN[it.un].d!==UN[m.un].d)it.un=USO_PADRAO[m.un];}));
  atualizarLista();salvar();toast(novo?'Material salvo':'Preço atualizado em todos os cálculos');
  const d=matDepois;matDepois=null;setTimeout(()=>{render();if(d)d(m);},0);
});
document.getElementById('mExcluir').onclick=()=>{
  const m=matEdit;if(!m)return;const usado=db.calculos.filter(c=>(c.itens||[]).some(i=>i.mat===m.id)).length;
  if(!confirm(`Excluir "${m.nome}"?${usado?`\nEle está em ${usado} cálculo(s) e vai ficar sem preço lá.`:''}`))return;
  db.calculos.forEach(c=>(c.itens||[]).forEach(it=>{if(it.mat===m.id){it.mat='';it.nome=m.nome;}}));
  db.materiais=db.materiais.filter(x=>x!==m);atualizarLista();salvar();dlgMat.close();render();
};
function cadastrarDoItem(i){const it=calcAtual.itens[i];abrirMat(null,it.nome,m=>{const q=document.querySelector(`#itens .item[data-i="${i}"] [data-k="qtd"]`);if(q&&!q.value)q.focus();});}
function atualizarLista(){document.getElementById('dl_mat').innerHTML=db.materiais.map(m=>`<option value="${esc(m.nome)}">`).join('');}

/* ================= AJUSTES ================= */
function telaAjustes(){const a=db.ajustes;
  return `<div class="card"><h2>Seus dados</h2>

document.getElementById('tela').addEventListener('input',e=>{const k=e.target.dataset.a;if(!k)return;db.ajustes[k]=['hora','margem','taxas'].includes(k)?lerQtd(e.target.value):e.target.value;salvar();});
function baixarBackup(){const b=new Blob([JSON.stringify(db,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='custo-certo-copia-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);}

/* ================= VOZ ================= */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let reco=null;
function falar(){
  if(reco){pararFala();return;}
  reco=new SR();reco.lang='pt-BR';reco.interimResults=true;reco.continuous=false;
  const b=document.getElementById('btnMic'),f=document.getElementById('fala');b.classList.add('ouvindo');b.textContent='⏹';f.textContent='Ouvindo...';
  reco.onresult=ev=>{let fin='',par='';for(let k=ev.resultIndex;k<ev.results.length;k++){const r=ev.results[k];if(r.isFinal)fin+=r[0].transcript;else par+=r[0].transcript;}
    if(par)f.textContent='Ouvindo: '+par;if(fin)receberFala(fin);};
  reco.onerror=ev=>{f.textContent=ev.error==='not-allowed'||ev.error==='service-not-allowed'?'O microfone não foi liberado. Libere nas permissões do navegador.':ev.error==='no-speech'?'Não ouvi nada. Toque em 🎤 e fale de novo.':'Não consegui ouvir. Tente de novo.';};
  reco.onend=()=>{reco=null;const b2=document.getElementById('btnMic');if(b2){b2.classList.remove('ouvindo');b2.textContent='🎤';}};
  try{reco.start();}catch(e){reco=null;}
}
function pararFala(){if(reco){try{reco.stop();}catch(e){}reco=null;}}
function receberFala(text){
  if(!calcAtual)return;const ls=entenderFala(text);const f=document.getElementById('fala');
  if(!ls.length){if(f)f.textContent='Não entendi: "'+text+'"';return;}
  ls.forEach(l=>calcAtual.itens.push(l));tocou();render();
  const f2=document.getElementById('fala');if(f2)f2.textContent='Entendi: '+ls.map(l=>`${l.qtd||''} ${UN_CURTO[l.un]||''} ${mat(l.mat)?mat(l.mat).nome:l.nome}`.trim()).join(' · ');
}
const NUMS={zero:0,um:1,uma:1,dois:2,duas:2,'três':3,tres:3,quatro:4,cinco:5,seis:6,sete:7,oito:8,nove:9,dez:10,onze:11,doze:12,treze:13,catorze:14,quatorze:14,quinze:15,dezesseis:16,dezessete:17,dezoito:18,dezenove:19,vinte:20,trinta:30,quarenta:40,cinquenta:50,sessenta:60,setenta:70,oitenta:80,noventa:90,cem:100,cento:100,duzentos:200,duzentas:200,trezentos:300,trezentas:300,quatrocentos:400,quatrocentas:400,quinhentos:500,quinhentas:500,seiscentos:600,setecentos:700,oitocentos:800,novecentos:900,mil:1000,meia:0.5,meio:0.5};
function palavrasNum(s){const w=s.split(/\s+/).filter(Boolean),out=[];let acc=null;
  for(let k=0;k<w.length;k++){const x=w[k],v=NUMS[x];
    if(v!=null){acc=x==='mil'?(acc||1)*1000:(acc||0)+v;continue;}
    if(x==='e'&&acc!=null&&NUMS[w[k+1]]!=null)continue;
    if(acc!=null){out.push(String(acc));acc=null;}out.push(x);}
  if(acc!=null)out.push(String(acc));return out.join(' ');}
const semAc=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const raizP=w=>w.replace(/oes$|aes$/,'ao').replace(/eis$/,'el').replace(/s$/,'');
function acharParecido(nome){
  const ws=semAc(nome).split(/[^a-z0-9]+/).filter(w=>w.length>=3&&!['com','para','das','dos','uma'].includes(w)).map(raizP);
  if(!ws.length)return null;let best=null,bs=0;
  db.materiais.forEach(m=>{const mw=semAc(m.nome).split(/[^a-z0-9]+/).filter(Boolean).map(raizP);
    const sc=ws.filter(w=>mw.some(x=>x===w||(x.length>=4&&w.length>=4&&(x.startsWith(w)||w.startsWith(x))))).length/ws.length;if(sc>bs){bs=sc;best=m;}});
  return bs>=0.5?best:null;
}
const PAL_UN=[[/^(quilos?|kg|kilos?|quilogramas?)$/,'kg'],[/^(gramas?|g)$/,'g'],[/^(litros?|l)$/,'L'],[/^(mililitros?|ml)$/,'ml'],[/^(x[ií]caras?|xic)$/,'xic'],
  [/^(metros?|m)$/,'m'],[/^(cent[ií]metros?|cm)$/,'cm'],[/^(mil[ií]metros?|mm)$/,'mm'],[/^(unidades?|un|pe[cç]as?)$/,'un'],[/^(d[uú]zias?)$/,'dz']];
function entenderFala(text){
  let s=String(text||'').toLowerCase().replace(/(\d),(\d)/g,'$1.$2').replace(/[;!?]|,\s|\.\s|\.$/g,' , ');
  s=palavrasNum(s).replace(/(\d)\s*(?:por|x|vezes)\s*(\d)/g,'$1x$2')
    .replace(/(\d+(?:\.\d+)?)\s+(quilos?|kg|litros?|metros?|x[ií]caras?|d[uú]zias?)\s+e\s+0\.5(?!\d)/g,(a,n,u)=>(+n+0.5)+' '+u)
    .replace(/colher(?:es)? de sopa/g,'csopa').replace(/colher(?:es)? de ch[aá]/g,'ccha');
  return s.split(/\s*,\s*|\s+(?:e|mais|depois)\s+(?=[a-zà-ú\d])/).map(p=>linhaFala(p.trim())).filter(Boolean);
}
function linhaFala(p){
  if(!p)return null;const w=p.split(/\s+/);let qtd='',un='',resto=[];
  for(let i=0;i<w.length;i++){const x=w[i];
    if(!qtd&&/^\d+(?:\.\d+)?(?:x\d+(?:\.\d+)?)?$/.test(x)){qtd=x.replace('.',',');continue;}
    if(qtd&&!un){if(x==='csopa'){un='cs';continue;}if(x==='ccha'){un='cc';continue;}const f=PAL_UN.find(([re])=>re.test(x));if(f){un=f[1];continue;}}
    resto.push(x);}
  let nome=resto.join(' ').replace(/^(de|do|da|dos|das)\s+/,'').replace(/\s+(de|do|da)$/,'').trim();
  if(!nome)return null;
  const it={nome:'',mat:'',qtd,un:''};definirNome(it,nome);
  const m=mat(it.mat);
  if(un&&m&&UN[un].d!==UN[m.un].d)un='';
  if(!un&&/x/.test(qtd)&&(!m||UN[m.un].d==='area'))un='cm2';
  it.un=un||(m?USO_PADRAO[m.un]:'un');
  if(!m)it.nome=it.nome.charAt(0).toUpperCase()+it.nome.slice(1);
  return it;
}
function ouvir(){
  const c=calcAtual,r=resumo(c);if(!window.speechSynthesis){toast('Este aparelho não consegue falar');return;}
  const fala=v=>{v=Math.round(v*100);const re=Math.floor(Math.abs(v)/100),ce=Math.abs(v)%100;return (re?re+(re===1?' real':' reais'):'')+(re&&ce?' e ':'')+(ce?ce+' centavos':'')||'zero reais';};
  const t=`${c.nome||'Cálculo'}. Custo total: ${fala(r.total)}.${r.rende!==1?` Rende ${numero(r.rende)}. Cada unidade custa ${fala(r.un)}.`:''} Preço de venda${r.rende!==1?' de cada':''}: ${fala(r.preco)}. Lucro: ${fala(r.lucro)}.`;
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';const v=speechSynthesis.getVoices().find(x=>/^pt/i.test(x.lang));if(v)u.voice=v;speechSynthesis.speak(u);
}

let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2600);}
atualizarLista();render();

      navigator.serviceWorker.getRegistration().then(r=>r&&r.update()).finally(()=>setTimeout(()=>location.reload(),1500));}}).catch(()=>{});
  setTimeout(checar,3000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checar();});
}
